<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книга 2 · пособие по урокам</title>
<meta property="og:type" content="website"><meta property="og:title" content="Книга 2 · пособие по урокам">
<meta property="og:description" content="العربية بين يدي أولادنا: диалоги с голосом диктора, слова, игры и тесты.">
<meta property="og:image" content="https://dzhos7465-dotcom.github.io/kniga2-posobie/hw/book.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Оформление по страницам учебника: шапка урока с волной и пальмой, кружки частей ١–٥,
   плашки заданий со значками, всё выровнено вправо как страница книги; дети со звёздами сбоку */
:root{
  --u:#b84773; --uD:#8c2d55; --uL:#fbe7ef; --uLL:#fff5f9;
  --sand:#f6c85a; --green:#3cae4a; --orange:#e9672e; --purple:#7d3c98; --maroon:#7a2b3a; --blue:#2c66b8;
  --ink:#2b2230; --mut:#7c6f80; --line:#f0dfe7; --paper:#fff; --bg:#fdf8fa; --sheet:#fffdf7; --rule:#ecdfc9;
  --ok:#3cae4a; --no:#e0404f; --gold:#f5b800;
  --fa:'Noto Naskh Arabic',serif; --fq:'Amiri Quran','Noto Naskh Arabic',serif; --ft:'Lalezar','Noto Naskh Arabic',serif; --fr:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fr);color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--fa);direction:rtl;line-height:1.8}
.stabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;direction:rtl;align-items:start}
.stab{background:#fff;border:3px solid #cfe6e2;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.stab .sh{font:700 24px var(--fa);text-align:center;color:#fff;background:var(--u);border-radius:10px;padding:2px 8px}
.stab .sl,.stab .sr{display:grid;gap:6px}.stab .sl span{font:700 22px var(--fa);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;justify-self:center}
.stab .sr .tile{font-size:22px;padding:2px 4px;text-align:center}
.stchoice button{font:700 52px var(--fa);min-width:110px}
.nashidimg{max-height:calc(100vh - 230px);max-width:100%;border-radius:18px}
.lnk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:110px;direction:rtl;width:min(100%,860px);align-self:center;margin-top:8px}
.lnk .col{display:flex;flex-direction:column;gap:12px;justify-content:center}
.lnk .it{min-height:76px;background:#fff;border:3px solid var(--line);border-radius:18px;font:700 28px/1.35 var(--fa);padding:6px 16px;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:2;direction:rtl}
.lnk .it img{max-height:104px;max-width:100%;object-fit:contain}.lnk.pics .dst{padding:4px}.lnk.sent .it.src{font-size:26px}.lnk.sent .dst img{max-height:130px}
.lnk .it .tg{position:absolute;top:-12px;right:-10px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 19px var(--fa)}
.lnk.txt .it{justify-content:flex-start;font-size:25px;padding-right:34px}
.lnk .it.sel{border-color:var(--u);background:var(--uLL);transform:scale(1.03)}.lnk .it.ok{border-color:var(--ok);background:#f2fbf3}.lnk .it.bad{border-color:var(--no);animation:shake .35s}
.lnk.pics:not(.sent) .it{min-height:90px;padding:3px 10px}.lnk.pics:not(.sent) .dst img{height:84px;max-height:none}
.lnk .lbl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.mt.qa{width:min(100%,760px)}.mt.qa .mcol{max-width:none}.mt.qa .mw{height:auto;min-height:72px;font-size:24px;line-height:1.35;padding:6px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;height:100%}
.app.side{grid-template-columns:200px 1fr}
.app.side .band,.app.side .subtabs,.app.side .view{grid-column:2}
.app.side .foot{grid-column:1;grid-row:1/5;flex-direction:column;align-items:stretch;border-top:0;border-right:2px dashed var(--line);padding:12px 10px;overflow:auto}
.app.side .foot .kid{justify-content:space-between;font-size:15px;padding:7px 12px}
.app.side .foot .kid button{opacity:1}
.app.side .foot .pg{margin:auto 0 0;flex-direction:column;text-align:center;font-size:11px}
.app.side.fold{grid-template-columns:46px 1fr}
.app.side.fold .foot>*:not(.fhead){display:none}
.app.side.fold .fhead span{display:none}
.fhead{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--u);font-size:14px}
.fhead button{background:var(--uLL);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900;color:var(--uD)}
.app:not(.side) .fhead{display:none}

/* ---------- book band ---------- */
.band{position:relative;color:#fff;padding:10px 22px 32px;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 90px,rgba(255,255,255,0) 90px 180px),linear-gradient(180deg,var(--u),var(--uD) 160%)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:var(--bg);
  -webkit-mask:radial-gradient(60px 26px at 60px 0,transparent 98%,#000) -60px 0/120px 30px repeat-x;mask:radial-gradient(60px 26px at 60px 0,transparent 98%,#000) -60px 0/120px 30px repeat-x}
.band .in{display:flex;align-items:center;gap:16px;direction:rtl;flex-wrap:wrap}
.island{position:relative;width:112px;height:80px;flex:none}
.island .sand{position:absolute;bottom:0;left:4px;right:0;height:22px;border-radius:50%;background:var(--sand);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.island .n{position:absolute;right:6px;bottom:6px;font:80px/1 var(--ft);color:#fff;-webkit-text-stroke:5px var(--u);paint-order:stroke fill}
.island svg{position:absolute;left:4px;bottom:12px;width:62px;height:78px}
.band h1{font:42px/1.25 var(--ft);text-shadow:0 3px 0 rgba(0,0,0,.12)}
.band .rus{font:800 14px var(--fr);opacity:.85;direction:ltr}
.parts{display:flex;gap:8px;margin-inline-start:auto;direction:rtl;align-items:center;flex-wrap:wrap}
.pc{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--u);font:700 24px/1 var(--fa);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.pc.on{background:var(--uD);color:#fff;box-shadow:inset 0 0 0 3px #fff,0 0 0 4px var(--sand)}
.pc.wide{width:auto;padding:0 14px;border-radius:22px;font:700 19px/1 var(--fa)} .pc.rus{font:900 13px/1 var(--fr)}
.tools{display:flex;gap:6px;direction:ltr;flex-wrap:wrap}
.tb{background:rgba(255,255,255,.18);color:#fff;padding:7px 11px;border-radius:12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.tb:hover{background:rgba(255,255,255,.3)} .tb.on{background:#fff;color:var(--u)} .tb svg{width:16px;height:16px}
.subtabs{display:flex;gap:8px;padding:0 24px;flex-wrap:wrap;align-items:center;margin-top:-8px;position:relative;z-index:2;direction:rtl}
.st{padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:15px;color:#5d5162;direction:ltr}
.st.on{border-color:var(--u);color:var(--u);background:var(--uLL)} .st small{font-weight:800;color:var(--mut);margin-left:6px}

/* ---------- page & footer ---------- */
.view{overflow:auto;padding:14px 26px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.foot{display:flex;gap:8px;align-items:center;padding:8px 18px 10px;border-top:2px dashed var(--line);background:#fff;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:var(--uLL);border:2px solid var(--line);font-weight:800;font-size:14px}
.kid.f{border-color:#f3b5cd} .kid.m{border-color:#b6cff0}
.kid.ask{background:#e6f6e8;border-color:var(--green)} .kid.ans{background:#fff0e3;border-color:var(--orange)}
.kid .s{color:var(--gold)} .kid .tst{font-size:11px;color:var(--mut);font-weight:900}
.kid button{opacity:0;font-size:12px;font-weight:900;color:var(--u)} .kid:hover button{opacity:1}
.pg{margin-left:auto;display:flex;align-items:center;gap:8px;direction:rtl;font:700 13px var(--fa);color:var(--u)}
.pg b{border:2px solid var(--u);border-radius:14px;padding:0 12px;font:700 18px var(--fa)}

/* ---------- right-aligned rows ---------- */
.hrow,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;direction:rtl}
.hrow>*,.row>*{direction:ltr}
.lab{display:inline-flex;align-items:center;direction:rtl!important}
.lab .no{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 22px var(--fa)}
.lab .tx{background:var(--u);color:#fff;font:700 21px/1.4 var(--fa);padding:5px 22px 7px 16px;margin-right:-10px}
.lab .ics{display:flex;gap:4px;background:var(--u);padding:4px 10px 4px 6px;border-radius:22px 0 0 22px;margin-right:-1px}
.lab.nonum .tx{border-radius:0 22px 22px 0;margin-right:0;padding-right:18px}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;flex:none}
.ic svg{width:20px;height:20px}
.ic.eye{background:#fff;color:var(--u);border-color:var(--u)} .ic.ear{background:var(--orange);color:#fff} .ic.rep{background:var(--green);color:#fff}
.ic.talk{background:var(--maroon);color:#fff} .ic.read{background:var(--purple);color:#fff} .ic.write{background:#8b4a2e;color:#fff} .ic.link{background:var(--sand);color:#7a4b00}
.paper{background:var(--paper);border-radius:22px;border:3px solid var(--line)}
.frame{background:#fff;border:3px solid var(--u);border-radius:26px;position:relative}
.frame>.rep{position:absolute;left:-14px;bottom:-14px}
.lead{color:var(--mut);font-size:15px;max-width:66ch;line-height:1.45}
.btn{display:inline-flex;gap:8px;align-items:center;white-space:nowrap;padding:9px 16px;border-radius:999px;font-weight:800;font-size:15px;background:var(--uL);color:var(--uD);border:2px solid transparent}
.btn.main{background:var(--u);color:#fff} .btn.go{background:var(--green);color:#fff} .btn.ghost{background:#fff;border-color:var(--line);color:#5d5162}
.btn svg{width:17px;height:17px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;direction:ltr}
.seg button{padding:6px 13px;border-radius:999px;font-weight:800;font-size:14px;color:#6b6070}
.seg button.on{background:var(--u);color:#fff}
.sheet{background:var(--sheet);border:2px solid #efe1c8;border-radius:8px 20px 20px 8px;box-shadow:4px 4px 0 #f3e7d1;background-image:repeating-linear-gradient(transparent 0 calc(var(--lh,58px) - 2px),var(--rule) calc(var(--lh,58px) - 2px) var(--lh,58px))}
.zoom{cursor:zoom-in}

/* ---------- home ---------- */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.lt{text-align:right;border-radius:24px;overflow:hidden;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column}
.lt .top{background:var(--c);height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;direction:rtl}
.lt .top .n{font:64px/1 var(--ft);color:#fff;-webkit-text-stroke:4px rgba(0,0,0,.18);paint-order:stroke fill}
.lt .top svg{width:46px;height:58px}
.lt .t{font:30px/1.3 var(--ft);color:var(--c);padding:10px 16px 0;direction:rtl}
.lt .s{font-size:13px;font-weight:800;color:var(--mut);padding:2px 16px 14px;text-align:left}
.lt .s.ready{color:var(--green)} .lt[disabled]{opacity:.55;cursor:default}

/* ---------- dialogue ---------- */
.dlg{display:grid;grid-template-columns:minmax(0,56%) minmax(0,1fr);gap:24px;align-items:start;direction:rtl}
.dlg .pic{border-radius:24px;overflow:hidden;border:3px solid var(--line);background:#fff;position:relative}
.dlg .pic img{width:100%;display:block}
.hintz{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font:800 12px var(--fr);color:var(--mut);direction:ltr}
.lines{padding:10px 8px}
.ln{display:flex;gap:12px;align-items:center;padding:4px 12px;border-radius:14px;direction:rtl;text-align:right;width:100%}
.ln:hover{background:var(--uLL)}
.ln .who{font:700 21px var(--fa);color:var(--maroon);min-width:70px}
.ln .tx{font:500 clamp(21px,2.1vw,29px)/1.75 var(--fa);flex:1}
.ln.a .tx{color:#1f8a4c} .ln.b .tx{color:var(--blue)} .ln.c .tx{color:#c4561c}
.ln .pl{width:32px;height:32px;border-radius:50%;background:var(--uL);display:grid;place-items:center;color:var(--u);flex:none}
.ln .pl svg{width:15px;height:15px}
.ln.cur{background:#fff3c4}
.lines.blur .tx{filter:blur(9px);opacity:.6}

/* ---------- words ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;direction:rtl}
.wc{display:flex;flex-direction:column;align-items:center;transition:.15s;border-radius:20px;padding:6px}
.wc:hover{transform:translateY(-3px);background:var(--uLL)}
.wc img{width:100%;aspect-ratio:1;object-fit:contain}
.wc .w{font:700 29px/1.5 var(--fa)} .wc.blue .w{color:var(--blue)}
.wc.hideword .w{color:transparent;background:var(--uL);border-radius:10px;min-width:70%}
.wc.playing{box-shadow:0 0 0 4px var(--gold)}
.big{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;direction:rtl}
.big .card{padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.big img{width:min(46vh,420px);aspect-ratio:1;object-fit:contain}
.big .w{font:700 62px/1.4 var(--fa)}
.arrow{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;color:var(--u)}
.arrow svg{width:26px;height:26px}

/* ---------- options / games ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;direction:rtl}
.gt{text-align:left;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-radius:22px;background:#fff;border:3px solid var(--line);position:relative;direction:ltr}
.gt:hover{border-color:var(--u)} .gt b{font:900 19px var(--fr)} .gt span{color:var(--mut);font-size:14px;line-height:1.4}
.gt em{font-style:normal;font-size:12px;font-weight:900;color:var(--u);text-transform:uppercase;letter-spacing:.04em}
.gt .ic{position:absolute;top:12px;right:12px}
.ghead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:4px} .pips i{width:13px;height:13px;border-radius:50%;background:#efdfe7} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--no)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;min-height:320px;position:relative}
.stage::before{content:'';margin-top:auto;margin-bottom:-18px}.stage::after{content:'';margin-bottom:auto;margin-top:-18px} /* по центру, а если не помещается — сверху, без наезда на заголовок */
.gstage{background:#fff;border:2px dashed var(--line);border-radius:26px;padding:22px 150px;position:relative}
.deco{position:absolute;bottom:12px;width:120px;pointer-events:none}
.deco.l{left:14px} .deco.r{right:14px}
.opts{display:grid;gap:18px;width:100%;max-width:1000px;direction:rtl}
.opts.n2{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.op{padding:10px;position:relative;transition:.2s;background:#fff;border:3px solid var(--line);border-radius:22px}
.op img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.op .tag{position:absolute;top:-14px;right:-10px;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 23px var(--fa)}
.op .bx,.blob .bx{position:absolute;bottom:-14px;left:-10px;width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--c,var(--u));display:grid;place-items:center;font:700 25px var(--fa);color:var(--u)}
.op .bx.ok,.blob .bx.ok{border-color:var(--ok);background:#ecf8ee;color:#2c8a3a} .op .bx.no,.blob .bx.no{border-color:var(--no);background:#fde6e8;color:var(--no)}
.op.good{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)} .op.bad{border-color:var(--no);animation:shake .35s} .op.dim{opacity:.35}
.op.sel{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.speaker{width:88px;height:88px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 0 0 4px var(--orange);flex:none}
.speaker svg{width:40px;height:40px} .speaker.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.tf{display:flex;gap:20px}
.tf button{width:116px;height:116px;border-radius:30px;font-size:56px;background:#fff;border:3px solid var(--line)}
.tf button.good{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)} .tf button.bad{border-color:var(--no);animation:shake .35s}
.tfcard{padding:12px} .tfcard img{width:min(36vh,300px);aspect-ratio:1;object-fit:contain;display:block}
.memo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:1000px;direction:rtl}
.cover{aspect-ratio:1;border-radius:18px;background:repeating-linear-gradient(45deg,var(--u),var(--u) 12px,var(--uD) 12px,var(--uD) 24px)}
.gone{aspect-ratio:1;border-radius:18px;border:4px dashed var(--u);display:grid;place-items:center;font:60px var(--ft);color:var(--u)}
.count{font:90px var(--ft);color:var(--u)}
.slot{min-height:86px;width:100%;max-width:820px;display:flex;flex-wrap:wrap;gap:10px;padding:14px;direction:rtl;align-items:center;justify-content:center;--lh:46px;transform:rotate(-.5deg)}
.slot.ok{box-shadow:4px 4px 0 #cfe9d3;border-color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:rtl}
.tile{font:700 32px/1.5 var(--fa);padding:4px 20px;border-radius:16px;background:#fff;border:3px dashed #d9c3cf}
.tile:hover{border-color:var(--u)} .tile.used{visibility:hidden} .tile.bad{animation:shake .35s;border-color:var(--no)}
.tile.good{border-style:solid;border-color:var(--ok);background:#ecf8ee} .tile.sel{border-style:solid;border-color:var(--gold);background:#fff7d6} .tile.playing{border-style:solid;border-color:var(--gold)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.big5{font:84px var(--ft);color:var(--u)}
.conc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;width:100%;max-width:1100px;direction:rtl}
.cc{aspect-ratio:1.1;border-radius:18px;font:700 clamp(16px,1.7vw,24px)/1.4 var(--fa);display:grid;place-items:center;padding:6px;text-align:center;transition:.25s}
.cc.back{background:repeating-linear-gradient(45deg,var(--u),var(--u) 10px,var(--uD) 10px,var(--uD) 20px);color:#fff;font:34px var(--ft)}
.cc.face{background:#fff;border:3px solid var(--u)} .cc.got{background:#ecf8ee;border:3px solid var(--ok);opacity:.85}
.stampbar{display:flex;gap:10px;justify-content:center}

/* ---------- tree (spotlight) ---------- */
.tw{position:relative;width:min(100%,calc((100vh - 360px) * 1.229));aspect-ratio:1610/1310;align-self:center}
.tw>img{width:100%;height:100%;border-radius:22px;display:block}
.tw .dim{position:absolute;inset:0;border-radius:22px;background:rgba(25,12,22,.48);pointer-events:none}
.hot{position:absolute;border-radius:12px;transition:.2s}
.hot:hover{background:rgba(255,255,255,.16)}
.lift{position:absolute;overflow:hidden;border-radius:14px;transform:scale(1.15);z-index:3;box-shadow:0 0 0 4px #fff,0 0 0 9px var(--gold),0 10px 28px rgba(0,0,0,.45);pointer-events:none}
.lift.bad{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--no)} .lift.ok{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--ok),0 0 34px 10px rgba(60,174,74,.6)}
.lift img{position:absolute;max-width:none}
.ttag{position:absolute;z-index:4;background:var(--gold);color:var(--ink);font:700 22px/1.4 var(--fa);padding:0 14px;border-radius:999px;border:3px solid #fff;transform:translate(-50%,-125%);pointer-events:none}
.say{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;direction:rtl}
.bubble{font:700 clamp(24px,2.5vw,34px)/1.6 var(--fa);direction:rtl;background:#fff;padding:4px 24px;border-radius:22px;border:3px solid var(--line)}
.bubble.q{border-color:#6ec27a;background:#effaf1} .bubble.r{border-color:#f0a25c;background:#fff4e8}
.bubble.hid{color:transparent;text-shadow:0 0 16px rgba(0,0,0,.4)}

/* ---------- listening (book style) ---------- */
.field{background:var(--uLL);border-radius:40px;padding:30px 30px 34px;display:flex;flex-wrap:wrap;gap:30px 28px;justify-content:center;direction:rtl;max-width:1050px}
.blob{position:relative;font:700 32px/1.5 var(--fa);padding:14px 30px;background:#fff;border:4px solid var(--c);border-radius:42% 58% 52% 48%/55% 45% 55% 45%;display:flex;align-items:center;gap:8px}
.blob .bx{top:-18px;bottom:auto}
.blob.now{box-shadow:0 0 0 6px var(--gold)} .blob img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.lbar{display:flex;gap:14px;align-items:center;direction:rtl;flex-wrap:wrap}
.lbar .num{font:700 30px var(--fa);color:var(--u)}

/* ---------- pairs ---------- */
.pairs{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:26px;align-items:center;padding:18px 22px 40px;width:min(100%,900px);direction:rtl}
.pairs .pic img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:18px}
.who2{display:flex;gap:12px;align-items:center;font-weight:900;font-size:clamp(17px,1.7vw,22px);flex-wrap:wrap;direction:rtl}
.nm{padding:5px 16px;border-radius:999px;direction:ltr} .nm.a{background:#e6f6e8;color:#24803a} .nm.b{background:#fff0e3;color:#b0560e}
.bubs{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bubs .bubble.r{align-self:flex-end}
.chips{position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;background:#fff;border:3px solid var(--u);border-radius:999px;padding:4px 10px;display:flex;gap:8px;white-space:nowrap;direction:rtl}
.chip{display:flex;align-items:center;gap:6px;font:700 20px var(--fa);padding:0 12px 0 4px;border-radius:999px}
.chip img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #eee;background:#fff}
.chip.on{background:var(--uL);outline:3px solid var(--u)}
.cue{display:flex;gap:16px;align-items:center;direction:rtl}
.cue img{width:150px;aspect-ratio:1;object-fit:contain;border-radius:18px;border:4px solid var(--gold);background:#fff}

/* ---------- sounds ---------- */
.tags{display:flex;flex-wrap:wrap;gap:34px 26px;justify-content:center;padding:4px 0 10px;direction:rtl}
.htag{position:relative;font:700 34px/1.5 var(--fa);border-radius:14px;padding:4px 20px;box-shadow:0 3px 0 rgba(0,0,0,.08);margin-top:36px;border:0}
.htag::before,.htag::after{content:"";position:absolute;top:-38px;width:2px;height:38px;background:#e8a93a}
.htag::before{right:22%} .htag::after{left:22%}
.htag i{position:absolute;top:-44px;width:14px;height:10px;border-radius:50%;background:#f06e6e;box-shadow:inset 0 0 0 2px #c94c4c}
.htag i.r{right:calc(22% - 6px)} .htag i.l{left:calc(22% - 6px)}
.htag.playing{outline:4px solid var(--gold)}
.towers{display:grid;grid-template-columns:repeat(3,minmax(0,230px));gap:26px;justify-content:center;direction:rtl}
.tower{background:#fff;border:3px solid #f0b9cf;border-radius:10px 10px 18px 18px;position:relative;padding:12px 10px 10px;display:flex;flex-direction:column;gap:6px}
.tower .roof{position:absolute;top:-34px;left:-8px;right:-8px;height:36px;background:linear-gradient(135deg,transparent 50%,#f7c25c 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#f7c25c 50%) right/50% 100% no-repeat}
.tower .flag{position:absolute;top:-62px;left:50%;width:3px;height:30px;background:#7a4b00}
.tower .flag::after{content:"";position:absolute;left:3px;top:0;border-left:22px solid var(--no);border-top:8px solid transparent;border-bottom:8px solid transparent}
.tower .hd{display:flex;justify-content:space-around;font:700 26px var(--fa)}
.tower .pr{display:flex;justify-content:space-around;gap:6px}
.tower .pr .tile{font-size:24px;padding:2px 10px;flex:1;text-align:center}
.mus{background:#fbf3df;border-radius:18px;padding:12px 26px;border:10px double #c9a35a;box-shadow:inset 0 0 0 3px #fff6e2;width:min(100%,860px);align-self:flex-end}
.mus .head{display:flex;justify-content:space-between;align-items:center;direction:rtl;font:700 15px var(--fr);color:#7a5a1a;margin-bottom:4px}
.ay{display:flex;align-items:center;gap:12px;direction:rtl;width:100%;text-align:right;border-bottom:1px dashed #e5d3a6;padding:2px 4px}
.ay:last-child{border-bottom:0}
.ay .t{font:34px/2.15 var(--fq);flex:1;color:#222}
.ay mark{background:#ffd9d9;border-radius:10px;padding:0 4px;box-shadow:inset 0 -3px 0 #e8a0a0;color:inherit}
.ay.cur{background:#fff3c4;border-radius:12px}
.ay .pl{width:30px;height:30px;border-radius:50%;background:#efe1bd;color:#7a5a1a;display:grid;place-items:center;flex:none} .ay .pl svg{width:14px;height:14px}
.syl{font:700 80px/1 var(--fa)}

/* ---------- reading ---------- */
.board{position:relative;width:min(100%,1000px);align-self:flex-end;padding:10px 0}
.board .rowp,.board .roww{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px;direction:rtl}
.board .roww{margin-top:110px}
.wcirc{aspect-ratio:1;border-radius:50%;border:5px solid var(--c,#e4c3d3);background:#fff;font:700 clamp(18px,1.8vw,25px) var(--fa);display:grid;place-items:center;position:relative;z-index:2}
.wcirc.sel{box-shadow:0 0 0 5px var(--gold)}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.readwrap{display:grid;grid-template-columns:minmax(0,55%) minmax(0,1fr);gap:22px;align-items:start;direction:rtl}
.text{padding:16px 26px 16px 54px;font:500 clamp(22px,2.1vw,28px)/58px var(--fa);direction:rtl;position:relative;--lh:58px}
.text::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:#f2b8b8}
.text .holes{position:absolute;left:10px;top:20px;bottom:20px;display:flex;flex-direction:column;justify-content:space-around}
.text .holes i{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid #e2d3bb;display:block}
.text mark{background:#fff0a8;border-radius:6px;padding:0 3px;color:inherit}
.qs{background:#5dae62;border-radius:22px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:10px}
.qs h3{font:700 24px var(--fa);direction:rtl}
.qcard{background:rgba(255,255,255,.14);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;direction:rtl}
.qcard .qt{font:700 25px/1.6 var(--fa);display:flex;gap:8px;align-items:center}
.qcard .qt i{font-style:normal;width:30px;height:30px;border-radius:50%;background:#fff;color:#3d8c43;display:grid;place-items:center;font-size:16px;flex:none}
.qcard .ch{display:flex;gap:8px;flex-wrap:wrap}
.qcard .ch button{background:#fff;color:var(--ink);font:700 21px/1.5 var(--fa);border-radius:12px;padding:2px 14px;border:3px solid transparent}
.qcard .ch button.good{border-color:var(--gold);background:#fffbe6} .qcard .ch button.bad{opacity:.45;animation:shake .35s}
.ansbox{background:#fff;color:var(--ink);border-radius:12px;padding:2px 14px;font:700 22px/1.6 var(--fa);align-self:flex-start}
.ansbox.hid{background:#3d8c43;color:transparent;min-width:160px;user-select:none}
.qnav{display:flex;gap:6px;flex-wrap:wrap;direction:rtl}
.qnav button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font:700 16px var(--fa)}
.qnav button.on{background:#fff;color:#3d8c43}
.book{display:grid;grid-template-columns:1fr 1fr;background:#5bbcd6;border-radius:24px;padding:16px;direction:rtl}
.book .pg2{background:#fff;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.book .pg2:first-child{border-radius:14px 4px 4px 14px;border-left:3px solid #d8eef4} .book .pg2:last-child{border-radius:4px 14px 14px 4px}
.sent{display:flex;gap:10px;align-items:center;font:700 26px/1.6 var(--fa);padding:4px 8px;border-radius:12px}
.sent i{font-style:normal;width:34px;height:34px;border-radius:50%;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font-size:18px;flex:none}
.sent.cur{background:#fff3c4}
/* letters */
.lpick{display:flex;gap:10px;direction:rtl}
.lpick button{width:62px;height:62px;border-radius:50%;font:700 34px var(--fa);color:#fff;background:var(--c);opacity:.55}
.lpick button.on{opacity:1;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c)}
.hunt{padding:14px 22px;width:min(100%,900px);align-self:flex-end;direction:rtl;--lh:64px}
.hunt .hl{font:500 30px/64px var(--fa);display:flex;gap:10px;flex-wrap:wrap;direction:rtl}
.hunt .hl b{font-weight:700;color:var(--maroon);min-width:70px}
.hunt .hw{border-radius:10px;padding:0 4px}
.hunt .hw:hover{background:#fff3c4}
.hunt .hw.found{background:#e9f7ec}
.letters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;direction:rtl}
.arch{border-radius:22px 22px 18px 18px;border:3px solid var(--c);background:#fff;display:flex;flex-direction:column;align-items:center;padding-bottom:10px;overflow:hidden}
.arch .top{width:100%;background:var(--c);color:#fff;font:700 44px/1.5 var(--fa);text-align:center}
.arch button{font:700 30px/1.6 var(--fa);padding:2px 10px;border-radius:12px;width:90%} .arch button:hover{background:#f7f0f4}
.pos{display:flex;gap:10px;justify-content:center}
.pos button{padding:10px 18px;border-radius:16px;background:#fff;border:3px solid var(--line);font-weight:900;font-size:17px}
.pos button.good{border-color:var(--ok);background:#ecf8ee} .pos button.bad{border-color:var(--no);animation:shake .35s}
.lw{font:700 110px/1.4 var(--fa);direction:rtl}
/* activity */
.act{background:#eaf6fb;border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:18px;border:3px dashed #a9d6e8}
.shapes{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:rtl}
.shape{font:700 26px/1.6 var(--fa);padding:6px 22px;background:#fff;border:4px dashed #9a9a9a;border-radius:24px;min-width:160px;text-align:center}
.shape.ghost{color:#cfc6cc;background:rgba(255,255,255,.6)} .shape.done{border-style:solid;border-color:var(--ok);background:#ecf8ee}
.shape.c1{border-radius:40px 14px 40px 14px} .shape.c3{border-radius:50px}
.half{font:700 26px/1.5 var(--fa);padding:4px 18px;border-radius:18px;background:#fff;border:4px dashed var(--c,#c76ac3)}
.half.sel{border-style:solid;background:#fff7d6;border-color:var(--gold)} .half.used{visibility:hidden} .half.bad{animation:shake .35s}
/* test */
.tq{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.tq .prompt{font:800 18px var(--fr);color:var(--mut)}
.tq .ask{font:700 clamp(30px,3.2vw,44px)/1.6 var(--fa);direction:rtl}
.chs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;direction:rtl}
.chs button{font:700 30px/1.6 var(--fa);background:#fff;border:3px solid var(--line);border-radius:18px;padding:4px 22px}
.chs button.good{border-color:var(--ok);background:#ecf8ee} .chs button.bad{border-color:var(--no);animation:shake .35s}
/* ссылки для домашки */
.hwrow{display:flex;flex-direction:column;gap:6px;width:100%;text-align:start}.hwl{display:flex;gap:8px;direction:ltr}.hwl input{flex:1;min-width:0;font-size:13px}
/* тест: соедини линиями, собери фразу */
.mt{position:relative;display:flex;justify-content:space-between;gap:80px;direction:rtl;width:min(100%,600px)}
.mcol{display:flex;flex-direction:column;gap:12px;flex:1;max-width:230px}
.mw,.mp{height:96px;background:#fff;border:3px solid var(--line);border-radius:18px;position:relative;z-index:2}
.mw{font:700 30px/1.2 var(--fa);padding:0 10px}.mp{padding:4px;display:grid;place-items:center}.mp img{max-height:84px;max-width:100%;object-fit:contain}
.mw.sel{border-color:var(--u);background:var(--uLL);transform:scale(1.04)}.mw.ok,.mp.ok{border-color:var(--ok);background:#f2fbf3}
.mw.bad,.mp.bad{border-color:var(--no);animation:shake .35s}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.bline{font:700 36px/1.7 var(--fa);direction:rtl;min-height:72px;width:min(100%,600px);border-bottom:3px dashed var(--line);padding:4px 16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.bline .ph{color:#d6c4ce}.bline.done{border-color:var(--ok);color:#2e7d32}
.chs button[disabled]{opacity:.22}
.cert{background:#fff;border:4px solid var(--u);border-radius:30px;padding:24px 34px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cert input,.who-in{font:800 20px var(--fr);text-align:center;border:0;border-bottom:3px dashed var(--line);padding:4px;width:260px}
.stars{font-size:42px;letter-spacing:4px;color:var(--gold)}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px}
.pick button{padding:10px 18px;border-radius:999px;background:#fff;border:3px solid var(--line);font-weight:900;font-size:16px}
.pick button:hover{border-color:var(--u)}
body.hw .tools,body.hw .parts,body.hw .subtabs,body.hw .foot{display:none}
body.hw .app.side{grid-template-columns:1fr} body.hw .app.side .band,body.hw .app.side .view{grid-column:1}

/* ---------- drawer / modal / lightbox ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#2b2230;color:#f3edf1;transform:translateX(100%);transition:.25s;z-index:30;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #43384a}
.drawer header button{margin-left:auto;font-size:22px;color:#cdbfd2}
.drawer .body{padding:16px 18px 40px;overflow:auto;font-size:15px;line-height:1.55}
.drawer h4{color:#f0a3c4;margin:14px 0 6px;font-size:15px} .drawer h4:first-child{margin-top:0}
.drawer .n{color:#e3d8e6;margin:4px 0}
.drawer .p{display:inline-block;background:#3d4a66;color:#bcd2ff;border-radius:6px;padding:0 7px;font-size:13px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(30,20,30,.45);display:none;align-items:center;justify-content:center;z-index:40}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:24px;padding:22px;width:min(520px,92vw);display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px var(--fr)}
.modal input{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px;font:14px var(--fr)}
.lb{position:fixed;inset:0;background:rgba(25,15,25,.86);display:none;align-items:center;justify-content:center;z-index:45;cursor:zoom-out}
.lnk.on{display:flex} .lnk img{max-width:92vw;max-height:88vh;border-radius:20px;border:6px solid #fff;background:#fff}
.lb span{position:absolute;top:16px;right:26px;color:#fff;font:900 36px var(--fr)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
/* ===== урок ٨: необязательные виды заданий (включаются ключами data.js) ===== */
/* صِلْ стр. ٧٤: слово в кружке и две картинки на дуге, как в книге (MATCH1.ring) */
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px;direction:rtl;width:100%;max-width:1060px;align-self:center}
.rg{position:relative;aspect-ratio:1/1.02;max-width:250px;width:100%;justify-self:center}
.rg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rg .rp{position:absolute;top:0;width:43%;aspect-ratio:1;padding:3px;border:3px solid var(--line);border-radius:16px;background:#fff;z-index:2}
.rg .rp.a{right:0}.rg .rp.b{left:0}.rg .rp img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.rg .rp .tag{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 16px var(--fa)}
.rg .rp.ok{border-color:var(--ok);background:#f2fbf3}.rg .rp.ok .tag{background:var(--ok);border-color:var(--ok);color:#fff}.rg .rp.bad{border-color:var(--no);animation:shake .35s}
.rg .rw{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:50%;aspect-ratio:1;border-radius:50%;background:#fff;border:5px solid var(--c);display:grid;place-items:center;font:700 25px/1.2 var(--fa);color:var(--ink);z-index:2;padding:4px}
.rg.done .rw{background:var(--c);color:#fff}
/* слушание стр. ٧٩: картинки по кругу часов (LX layout:'clock') */
.clock{position:relative;width:min(640px,92vw);aspect-ratio:1;align-self:center;margin:6px auto 0}
.clock .dial{position:absolute;inset:11%;border-radius:50%;border:26px solid #4db3e0;box-shadow:inset 0 0 0 6px #e5f4fb}
.clock .hand{position:absolute;left:50%;top:50%;width:5.5%;height:28%;background:#c9c9c9;border-radius:10px;transform-origin:50% 0;box-shadow:0 2px 0 #aaa}
.clock .hub{position:absolute;left:50%;top:50%;width:20%;aspect-ratio:1;border-radius:50%;border:16px solid #2c93bf;background:#fff;transform:translate(-50%,-50%)}
.clock .op{position:absolute;width:22%;margin:-11% 0 0 -11%;padding:4px;border-radius:16px}
.clock .op img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.clock .op .bx{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);margin:0}
/* звуки стр. ٧٨: «ال» الشَّمْسِيَّة و«ال» الْقَمَرِيَّة — змейка (SNAKE) */
.snk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;direction:rtl;width:min(100%,1000px);align-self:center;background:#f3ebdd;border-radius:34px;padding:22px;box-shadow:inset 0 0 0 4px #e8dcc6}
.snk .tl{position:relative;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:7px solid;border-radius:14px;margin:-2px;font:700 25px/1.4 var(--fa);background:#fff;transition:.15s}
.snk .tl.sun{border-color:#f2b72b;background:#fffaf0}.snk .tl.moon{border-color:#3b3f8f}
.snk .tl .lt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--fa)}
.snk .tl.sun .lt{background:#ffd451;color:#c2410c;box-shadow:0 0 0 4px #ffe9a0}.snk .tl.moon .lt{background:#eef0ff;color:#3b3f8f;box-shadow:0 0 0 3px #c7cbf3}
.snk .tl .al{color:#b9b0a5}.snk .tl.moon .al b{color:#3b3f8f}.snk .tl.sun .al+i{color:#e8590c;font-style:normal}
.snk .tl.playing{transform:scale(1.07);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.snk .tl{grid-row:var(--r);grid-column:var(--c)}
.snk1 .al{color:#b9b0a5}.snk1 .al b{color:#3b3f8f}.snk1 i{color:#e8590c;font-style:normal}
.sunkey{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font:800 15px var(--fr)}
.sunkey span{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:#fff;border:3px solid}
.sunq{display:flex;gap:26px;justify-content:center}.sunq button{width:170px;height:120px;border-radius:24px;border:4px solid;background:#fff;font:800 22px var(--fr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sunq button.s{border-color:#f2b72b;color:#c2410c}.sunq button.m{border-color:#3b3f8f;color:#3b3f8f}.sunq button b{font-size:46px;line-height:1}

const NOTES={
 dialog:`<h4>Как работать с диалогом (5 мин)</h4><div class="n">1. Включите «Только слушать»: текст размыт. Одна фраза по-русски перед этим: «Когда услышите <span class="ar">بَيْت</span>, поднимите руку».</div><div class="n">2. Нажмите «Весь диалог». Строки подсвечиваются по очереди.</div><div class="n">3. Второй раз с текстом. Нажимайте на строки по одной, после каждой пауза 2 секунды.</div><div class="n">4. Третий раз хором: дети повторяют за диктором реплики <span class="ar">مُحَمَّد</span>.</div>`,
 words:`<h4>Слова (5–7 мин)</h4><div class="n">Нажмите на карточку, звучит диктор. Потом включите «Скрыть слова»: вы показываете картинку, дети называют хором.</div><div class="n">Режим «По одной» удобен для показа в Zoom: крупно, листается стрелками ← →.</div><h4>Жесты, которые уже договорились</h4><div class="n"><span class="ar">عَمّ</span> брат папы, <span class="ar">خَال</span> брат мамы. Вперёд рукой значит сейчас (<span class="ar">يُصَلِّي، يَذْهَبُ</span>), через плечо значит уже было (<span class="ar">صَلَّيْتُ، ذَهَبَ</span>). <span class="ar">الْيَوْمَ</span> ладони вниз.</div>`,
 games:`<h4>Как играть в Zoom</h4><div class="n">Вы показываете экран и кликаете сами. Дети отвечают пальцами: левая картинка один палец, следующая два и так далее. Или называют ответ.</div><div class="n">Дома ребёнок может играть сам по ссылке.</div><h4>Порядок по трудности</h4><div class="n">1. Слушай и найди (2 картинки) → 2. то же с 4 картинками → 3. Правда или нет → 4. Что пропало → 5. Собери фразу. Первые три только понимание, без говорения. «Собери фразу» после того, как дети уже говорили.</div>`,
 tree:`<h4>Дерево семьи · стр. ٤٤ (7 мин)</h4><div class="n">Вы говорите от имени героя в зелёной рамке. Скажите фразу на экране два раза. <span class="p">3 сек</span> Дети показывают пальцами номер или кликают сами.</div><div class="n">Главная находка: <span class="ar">خَالِد</span> для <span class="ar">عِيسَى</span> это <span class="ar">عَمّ</span>, а для <span class="ar">بَاسِم</span> это <span class="ar">خَال</span>. Когда дойдёте до вопроса ٣, скажите подряд обе фразы.</div>`,

 listen:`<h4>Упражнения на слушание · стр. 45 и 49</h4><div class="n">Звук это настоящая запись издателя: диктор называет номер и слово. Нажмите «Слушать», дети показывают ответ пальцами или кликают сами.</div><div class="n">В упр. ٣, ٤, ٥ приложение само проверяет ответ. Ключи я определил по звуку, сравнив каждое слово с эталонным словом диктора.</div><div class="n">В упр. ٧ и ٨ ключа нет: там фразы, которые я не смог надёжно распознать. Ответ проверяете на слух вы.</div>`,
 sounds:`<h4>Звуки ش и س · стр. 48</h4><div class="n">1. Имена с ش: нажимайте по одному, дети повторяют.</div><div class="n">2. Пары слов: в каждой паре сначала ش, потом س. Лучше идти по столбику и делать паузу.</div><div class="n">3. Аяты: дети слушают и находят ش. Красным отмечено место звука.</div><div class="n">4. Игра «Подними руку»: звучит слог, если там ش, руку вверх. Порядок ответов определён по звуку автоматически.</div>`,
 pairs:`<h4>Пары по цепочке</h4><div class="n">Сначала модель: вы читаете обе роли два раза, поворачивая голову.</div><div class="n">Потом на экране зелёный спрашивает, оранжевый отвечает. Назовите имена и покажите жестом. Если ребёнок молчит 3 секунды, шёпотом первое слово. Ошибку не называйте, просто повторите правильно.</div><div class="n">«Пара справилась» даёт обоим звезду, отвечавший становится спрашивающим. Во втором круге нажмите «Размыть текст».</div><div class="n">Вопрос ٦ из упр. ٤ (<span class="ar">أَيْنَ ذَهَبْتَ الْيَوْمَ؟</span>) убран: ответ требует новых слов.</div>`

 dialog:`<h4>Как работать с диалогом (5 мин)</h4><div class="n">1. «Только слушать»: текст размыт. Перед этим одна фраза по-русски: «Когда услышите <span class="ar">جَدَّتِي</span>, поднимите руку».</div><div class="n">2. «Весь диалог». Строки подсвечиваются по очереди. Говорят трое: <span class="ar">لَطِيفَة</span> (зелёный), <span class="ar">بَتُول</span> (синий) и в конце <span class="ar">صَفِيَّة</span> (оранжевый).</div><div class="n">3. Второй раз с текстом, по одной строке, пауза 2 секунды.</div><div class="n">4. Третий раз хором: дети повторяют реплики <span class="ar">بَتُول</span>.</div><h4>Жесты</h4><div class="n"><span class="ar">مَعَ</span> две ладони рядом. <span class="ar">مِنْ فَضْلِكِ</span> ладонь к сердцу. <span class="ar">زَوْج / زَوْجَة</span> покажите на дереве пару <span class="ar">قَاسِم — فَاطِمَة</span>.</div><h4>مَنْ и مِنْ</h4><div class="n">Обе встречаются в одной фразе: <span class="ar">مَنْ هَذِهِ مِنْ فَضْلِكِ؟</span> Голосом выделите разницу, на доске огласовку <span class="ar">مَنْ</span> покажите красным.</div>`,
 words:`<h4>Слова (5–7 мин)</h4><div class="n">Нажмите на карточку, звучит диктор. Потом «Скрыть слова»: вы показываете картинку, дети называют хором.</div><h4>Ввести заранее</h4><div class="n"><span class="ar">وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ</span> дети знают по салату, только назовите. <span class="ar">وَلَد</span> из рамки пар ١: покажите на дереве <span class="ar">عِيسَى</span>: <span class="ar">هَذَا وَلَدٌ</span>.</div><div class="n"><span class="ar">زَوْجَةُ أَخِي</span> давайте целым блоком, без разбора.</div><h4>Счётчик (цель 40 за занятие)</h4><div class="n"><span class="ar">جَدَّة ☐ زَوْج ☐ زَوْجَة ☐ أَطْفَال ☐ صَدِيقَة ☐ مِنْ فَضْلِكِ ☐ مَعَ ☐</span></div>`,
 tree:`<h4>Дерево семьи · стр. 64 (7 мин)</h4><div class="n">То же дерево, что в уроке 5. Герой, от имени которого вы говорите, поднят и подписан «أَنَا». Скажите фразу два раза. <span class="p">3 сек</span> Дети показывают или кликают.</div><div class="n">Все фразы из рамок урока: <span class="ar">جَدَّتِي، زَوْجِي، زَوْجَةُ أَخِي، أُخْتِي</span>. Главное: <span class="ar">فَاطِمَة</span> для <span class="ar">قَاسِم</span> жена, а для <span class="ar">خَالِد</span> <span class="ar">زَوْجَةُ أَخِي</span>.</div><div class="n">«Соедини · стр. 64» — упр. ٢, как в книге: ребёнок нажимает слово (диктор его произносит), потом картинку, и протягивается линия. В Zoom дети называют букву картинки: <span class="ar">زَوْجَةٌ — خ</span>.</div>`,
 listen:`<h4>Слушание · стр. 65 и 69</h4><div class="n">Звук издателя: диктор называет номер и слово.</div><div class="n">Упр. ٣, ٤, ٥ стр. 65: ключи надёжные, каждое слово я сравнил с эталонным словом диктора.</div><div class="n">Упр. ٤ стр. 69: звучат фразы, ключ я не определил. Ответ проверяете вы на слух.</div>`,
 sounds:`<h4>Звуки · стр. 68–69</h4><div class="n">Три таблицы, как в книге: звук в начале, в середине и в конце слова. Нажмите на слово, дети повторяют хором. «Слушать всё по порядку» — с паузой для повтора.</div><div class="n">Слова в таблицах — тренировка звука, значения не разбираем. Буква звука выделена красным.</div><div class="n">«Какой звук?» — 10 слов вперемешку из всех таблиц. Ответ проверяется по таблице, ключ точный.</div><div class="n">Как произносить: <span class="ar">ص</span> толстый звук, язык внизу, <span class="ar">س</span> тонкий. <span class="ar">ق</span> глубоко в горле, <span class="ar">ك</span> в середине. <span class="ar">ظ ذ</span> язык между зубами.</div>`,
 pairs:`<h4>Пары по цепочке</h4><div class="n">Не раньше третьего занятия по теме. Сначала модель: вы читаете обе роли два раза.</div><div class="n">Упражнения книги написаны для девочек (<span class="ar">مَعَ زَمِيلَتِكِ</span>). Мальчику вопрос задаётся с <span class="ar">مِنْ فَضْلِكَ، عَمُّكَ</span> — приложение подставляет форму само по полу отвечающего.</div><div class="n">Упр. ٢, первая карточка (<span class="ar">أَيْنَ زَوْجُكِ؟</span>) — это роль <span class="ar">صَفِيَّة</span> из диалога, её играют все.</div><div class="n">Упр. ٥ стр. 67 — не диалог, а задание на внимание: на картинке муж и жена с именами, ребёнок читает фразу и выбирает пропущенное слово (<span class="ar">زَوْجُ / زَوْجَةُ</span> или имя). Ошибка не засчитывается, можно выбрать снова. Номера карточек внизу.</div>`,
 read:`<h4>Чтение · стр. 70–71</h4><div class="n">«Фраза и картинка» — упр. ١ стр. 70: ребёнок читает фразу вслух и соединяет её с картинкой. Новое слово <span class="ar">هَاتِ</span> = <span class="ar">أَعْطِنِي</span> (урок 6): покажите жестом.</div><div class="n">«Вопрос и ответ» — упр. ٢ стр. 70: читает вопрос, находит ответ, линия. Ключ книги. Этот же вид задания есть в домашке части 2.</div><div class="n">«Читаем по очереди» — все фразы стр. 70 строкой, по одному ребёнку.</div><div class="n">Текст стр. 71: новое <span class="ar">عَمَّتِي</span> (тётя, сестра папы — дети видели на дереве урока 1) и <span class="ar">ـهَا</span> «её»: <span class="ar">بَيْتُهَا، زَوْجُهَا، وَلَدُهَا</span>. Покажите жестом на Сафию.</div><div class="n">Первые четыре вопроса — задание книги «поставь ✗ у неверной фразы»: ✓ верно, ✗ неверно. Дальше мои вопросы на знакомых словах.</div>`,
 letters:`<h4>Буквы ج ح خ · стр. 71</h4><div class="n">«Охота за буквой» по диалогу: <span class="ar">ج</span> в <span class="ar">جَدَّتِي، زَوْجِي</span>, <span class="ar">ح</span> в <span class="ar">وَرَحْمَةُ</span>, <span class="ar">خ</span> в <span class="ar">أُخْتِي، أَخِي</span>.</div>`,
 activity:`<h4>نَشَاط · стр. 72</h4><div class="n">В книге здесь нашид «أُمِّي». Кнопка «نَشِيدُ أُمِّي» открывает страницу книги и запись издателя. Слушаем, значение не разбираем, кроме <span class="ar">أُمِّي</span> = <span class="ar">وَالِدَتِي</span>.</div><div class="n">Игра со словами — фразы урока: 3–5 минут как разминка в чтении.</div>`,

function lift(k,cls,tag){const b=TREE[k];const wB=b[2]-b[0],hB=b[3]-b[1];
 return `<div class="lift ${cls||''}" style="${pct(b)}"><img src="${A.b_tree}" style="width:${TREE_W/wB*100}%;height:${TREE_H/hB*100}%;left:${-b[0]/wB*100}%;top:${-b[1]/hB*100}%"></div>`+(tag?`<div class="ttag" style="left:${(b[0]+b[2])/2/TREE_W*100}%;top:${b[1]/TREE_H*100}%">${tag}</div>`:'')}

 }else{hs=lift(q.spk,'','أَنَا')+lift(q.pt,T.ans?(q.ok?'ok':'bad'):'','هَذَا')}
 const bubble=T.mode==='who'?(T.ans?`<div class="bubble r">${q.after}</div>`:`<div class="bubble q">${q.line}</div>`):(`<div class="bubble q">${q.line}</div>`+(T.ans?`<div class="bubble r">${q.fix}</div>`:''));

 <div class="tw"><img src="${A.b_tree}" alt="Дерево семьи Мухаммада"><div class="dim"></div>${hs}</div>`;
 $('#tw').onclick=()=>{T={mode:'who',i:0,ans:null};tree()};$('#tt').onclick=()=>{T={mode:'tf',i:0,ans:null};tree()};if($('#tm'))$('#tm').onclick=()=>{T={mode:'m1',i:0,ans:null};T6={mode:'m1',i:0,ans:null};tree()};if($('#tbk'))$('#tbk').onclick=()=>{$('#lbImg').src=A[CUR.TREEBOOK];$('#lb').classList.add('on')};

 if(T.mode==='who')$$('button.hot').forEach(b=>b.onclick=()=>{const ok=q.ans.includes(b.dataset.p);tone(ok);T.ans=ok?'ok':b.dataset.p;tree()});
 else{const h=v=>{tone(v===q.ok);T.ans=1;tree()};$('#ty').onclick=()=>h(true);$('#tno').onclick=()=>h(false)}

// صِلْ как в книге урока ٨ (стр. ٧٤): слово в кружке внизу, на дуге две картинки أ и ب; верная сторона дуги окрашивается

 <div class="rings">${M.items.map(([w,a,b,key,c],i)=>{const ok=st[i];c=c||'#e8794a';return `<div class="rg ${ok?'done':''}" style="--c:${c}"><svg viewBox="0 0 200 204" aria-hidden="true"><circle cx="100" cy="108" r="74" fill="none" stroke="#ece4d6" stroke-width="7"/>${ok?`<path d="${arc(key)}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`:''}</svg>${[['أ',a,'a'],['ب',b,'b']].map(([l,k,x])=>`<button class="rp ${x} ${ok&&x===key?'ok':''}" data-rg="${i}" data-s="${x}" aria-label="${l}"><img src="${PIC(k)}" alt=""><span class="tag">${l}</span></button>`).join('')}<button class="rw" data-rw="${i}">${W(w).w}</button></div>`}).join('')}</div>`;

// ================= «Соедини линиями» как в книге (урок ٧): правый столбец ↔ левый, верёвочка =================
// cfg: {id, src:[{k,html,snd}], dst:[{k,html}], cls}; совпадение по k. Состояние LB[id] живёт, пока открыт урок.
let LB={};
function linkBoard(cfg){const st=LB[cfg.id]=LB[cfg.id]||{sel:null,got:{}};
 return `<div class="lnk ${cfg.cls||''}" id="lb_${cfg.id}"><div class="col">${cfg.src.map((x,i)=>`<button class="it src ${st.got[x.k]?'ok':''} ${st.sel===i?'sel':''}" data-ls="${i}">${x.html}</button>`).join('')}</div><div class="col">${cfg.dst.map((x,j)=>`<button class="it dst ${st.got[x.k]?'ok':''}" data-ld="${j}">${x.html}</button>`).join('')}</div><svg class="lbl"></svg></div>`}
function wireBoard(cfg,redraw){const st=LB[cfg.id],box=$('#lb_'+cfg.id);if(!box)return;const COL=['#ef6c00','#3cae4a','#2f80d1','#d6337a','#8e44ad','#c08a3e','#1f9c8f','#e04a4a','#5a7fc0'];
 const draw=()=>{if(!box.isConnected)return;const r0=box.getBoundingClientRect();box.querySelector('svg').innerHTML=cfg.src.map((x,i)=>{if(!st.got[x.k])return '';const j=cfg.dst.findIndex(d=>d.k===x.k);const a=box.querySelector(`[data-ls="${i}"]`).getBoundingClientRect(),b=box.querySelector(`[data-ld="${j}"]`).getBoundingClientRect();const x1=a.left-r0.left,y1=a.top+a.height/2-r0.top,x2=b.right-r0.left,y2=b.top+b.height/2-r0.top,mx=(x1+x2)/2;return `<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" stroke="${COL[i%COL.length]}" stroke-width="5" fill="none" stroke-linecap="round"/>`}).join('')};
 requestAnimationFrame(draw);box._draw=draw;
 box.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ls;const x=cfg.src[i];if(st.got[x.k])return;st.sel=i;if(x.snd)play(x.snd);redraw()});
 box.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{const j=+b.dataset.ld;if(st.sel===null)return;const x=cfg.src[st.sel],d=cfg.dst[j];if(st.got[d.k])return;
  if(x.k===d.k){st.got[x.k]=1;st.sel=null;tone(true);redraw();if(cfg.src.every(s=>st.got[s.k]))confetti()}else{tone(false);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}})}
window.addEventListener('resize',()=>$$('.lnk').forEach(b=>b._draw&&b._draw()));

let X={ex:{1:0,2:3},i:0,ans:{},checked:{},mode:'now',hint:false};
function listen(part){
 const list=LX.filter(e=>e.part===part);let ei=X.ex[part];
 const ex=LX[ei];const cnt=ex.type==='ab'?ex.items.length:(ex.key?ex.key.length:ex.count);
 const A_=X.ans[ex.id]=X.ans[ex.id]||{};const chk=X.mode==='now'||X.checked[ex.id];
 const right=i=>ex.type==='ab'?ex.items[i][2]:(ex.key?ex.key[i]:null);
 const head=`<div class="hrow">${LAB(ex.n,ex.title)}<div class="seg">${list.map(e=>`<button data-x="${LX.indexOf(e)}" class="${e===ex?'on':''}">Упр. ${e.n}</button>`).join('')}</div>

  ${ex.type==='word'?`<button class="btn ghost" id="xHint">${X.hint?'Убрать подсказку':'Подсказка: картинки'}</button>`:''}
  <button class="btn ghost" id="xReset">Заново</button></div>
 <div class="lbar"><button class="speaker" id="xPlay" aria-label="Слушать">${I.spk}</button><span class="num">الرَّقْمُ ${AN[X.i]}</span><div class="seg">${Array.from({length:cnt},(_,i)=>`<button data-i="${i}" class="${i===X.i?'on':''}">${AN[i]}</button>`).join('')}</div>
  ${X.mode==='end'&&!X.checked[ex.id]&&(ex.key||ex.type==='ab')?`<button class="btn go" id="xCheck">Проверить</button>`:''}</div>`;
 // where each item number is written
 const numsOn=k=>Object.keys(A_).filter(i=>A_[i]===k).map(Number);
 const bx=(k,isAB)=>{const ns=numsOn(k);if(!ns.length)return `<span class="bx"></span>`;const i=ns[ns.length-1];const ok=right(i)===null?'':(right(i)===k?'ok':'no');return `<span class="bx ${chk?ok:''}">${isAB?'✓':AN[i]}</span>`};

 if(ex.type==='pic'&&ex.layout==='clock')body=`<div class="clock"><div class="dial"></div><div class="hand" style="transform:translateX(-50%) rotate(140deg)"></div><div class="hand" style="transform:translateX(-50%) rotate(220deg)"></div><div class="hub"></div>${ex.pics.map(([l,k,a])=>`<button class="op" data-ans="${k}" style="left:${(50+39*Math.cos(a*Math.PI/180)).toFixed(2)}%;top:${(50+39*Math.sin(a*Math.PI/180)).toFixed(2)}%"><span class="tag">${l}</span><img src="${PIC(k)}" alt="">${bx(k)}</button>`).join('')}</div>`;
 else if(ex.type==='pic')body=`<div class="opts" style="grid-template-columns:repeat(${ex.pics.length},minmax(0,1fr));max-width:${ex.pics.length*200}px">${ex.pics.map(([l,k])=>`<button class="op" data-ans="${k}"><span class="tag">${l}</span><img src="${PIC(k)}" alt="">${bx(k)}</button>`).join('')}</div>`;

// ================= звуки таблицами (урок ٧ стр. ٦٨–٦٩): CUR.STAB =================
// STAB:[{t,n,L:[буквы столбцов],C:[цвета столбцов],pre:'s1',secs:[[заголовок,[[слово для каждой буквы],…]],…]}]
// звук: pre_0, pre_1 … по строкам (справа налево), раздел за разделом
function stabHi(w,l){return w.replace(new RegExp('('+l+'[ً-ْ]*)','g'),'<span style="color:var(--no)">$1</span>')}
function stabItems(t){const T=CUR.STAB[t],out=[];let k=0;T.secs.forEach(([h,rows])=>rows.forEach(r=>r.forEach((w,j)=>out.push({w,l:T.L[j],j,key:T.pre+'_'+(k++),opts:T.L}))));return out}
function soundTables(){
 const ST=CUR.STAB;const tabs=[...ST.map(t=>t.t),'Какой звук?'];let body='';
 if(SX.tab<ST.length){const T=ST[SX.tab];let k=0;
  body=`<div class="hrow">${LAB(T.n,'اِسْتَمِعْ وَأَعِدْ')}<button class="btn" id="stAll">${I.play}Слушать всё по порядку</button><button class="btn ghost" id="stStop">Стоп</button><span class="lead">Нажмите на слово. Дети повторяют хором.</span></div>
  <div class="stabs">${T.secs.map(([h,rows])=>`<div class="stab"><div class="sh">${h}</div><div class="sl" style="grid-template-columns:repeat(${T.L.length},minmax(0,1fr))">${T.L.map((l,j)=>`<span style="background:${T.C[j]}">${l}</span>`).join('')}</div>${rows.map(r=>`<div class="sr" style="grid-template-columns:repeat(${T.L.length},minmax(0,1fr))">${r.map((w,j)=>`<button class="tile" data-p="${T.pre}_${k++}">${stabHi(w,T.L[j])}</button>`).join('')}</div>`).join('')}</div>`).join('')}</div>`}
 else{const all=ST.flatMap((_,t)=>stabItems(t));
  if(!SX.q){SX.q=shuffle(all).slice(0,10);SX.g=0;SX.res=[];SX.shown=false}
  const i=SX.g;
  if(i>=SX.q.length){const ok=SX.res.filter(Boolean).length;body=`<div class="stage"><div class="done"><div class="big5">${ok} / ${SX.q.length}</div><button class="btn main" id="sAgain">Ещё раз</button></div></div>`}
  else{const q=SX.q[i];
   body=`<div class="hrow">${LAB('','اِسْتَمِعْ: أَيُّ حَرْفٍ؟',['ear'])}<span class="lead">Звучит слово из таблиц. Какой звук? Ответ проверяется по таблице книги.</span></div><div class="stage"><div class="row" style="justify-content:center;gap:10px">${SX.q.map((v,j)=>`<span style="width:18px;height:18px;border-radius:50%;background:${j<i?(SX.res[j]?'var(--ok)':'var(--no)'):'#efdfe7'}"></span>`).join('')}</div>
   <button class="speaker pulse" id="sSpk" aria-label="Повторить">${I.spk}</button>
   ${SX.shown?`<div class="syl">${stabHi(q.w,q.l)}</div><div class="lead">${SX.res[i]?'Верно!':'Это был звук '+q.l}</div><button class="btn main" id="sNext">${I.left}Дальше</button>`
   :`<div class="tf stchoice">${q.opts.map(l=>`<button data-sl="${l}">${l}</button>`).join('')}</div>`}</div>`}}
 $('#view').innerHTML=`<div class="row"><div class="seg">${tabs.map((t,i)=>`<button data-st="${i}" class="${i===SX.tab?'on':''}">${t}</button>`).join('')}</div></div>`+body;
 $$('[data-st]').forEach(b=>b.onclick=()=>{SX=Object.assign(SX,{tab:+b.dataset.st,g:0,res:[],shown:false,q:null,run:0});soundTables();if(SX.tab===ST.length)setTimeout(()=>SX.q&&play(SX.q[0].key),300)});
 $$('[data-p]').forEach(b=>b.onclick=()=>{SX.run=0;play(b.dataset.p,b)});
 if($('#stAll')){$('#stAll').onclick=()=>{const run=SX.run=Date.now();const els=[...$$('[data-p]')];let i=0;const nx=()=>{if(SX.run!==run||i>=els.length||S.view!=='sounds')return;const el=els[i++];el.scrollIntoView({block:'nearest'});const a=play(el.dataset.p,el);if(a)a.onended=()=>{el.classList.remove('playing');setTimeout(nx,Math.max(1400,(a.duration||1)*1500))}};nx()};$('#stStop').onclick=()=>{SX.run=0;if(cur)cur.pause()}}
 if($('#sSpk'))$('#sSpk').onclick=()=>play(SX.q[SX.g].key);
 $$('[data-sl]').forEach(b=>b.onclick=()=>{const q=SX.q[SX.g];const ok=b.dataset.sl===q.l;tone(ok);SX.res.push(ok);SX.shown=true;soundTables();play(q.key)});
 if($('#sNext'))$('#sNext').onclick=()=>{SX.g++;SX.shown=false;soundTables();if(SX.g<SX.q.length)setTimeout(()=>play(SX.q[SX.g].key),400)};
 if($('#sAgain'))$('#sAgain').onclick=()=>{SX.q=null;soundTables();setTimeout(()=>play(SX.q[0].key),300)};
}
// ================= «ال» الشَّمْسِيَّة و«ال» الْقَمَرِيَّة (урок ٨ стр. ٧٨): CUR.SNAKE =================
// SNAKE:{n,page,title,pre:'s1',w:[[буква, слово с ال]…]} — 28 плиток змейкой по алфавиту; звук pre_0…pre_27
const SUNL='تثدذرزسشصضطظلن';
const isSun=w=>SUNL.includes(w[2]);
function snkHtml(w){if(isSun(w)){let e=3;while(e<w.length&&/[ً-ْ]/.test(w[e]))e++;return `<span class="al">ال</span><i>${w.slice(2,e)}</i>${w.slice(e)}`}return `<span class="al">ا<b>${w.slice(1,3)}</b></span>${w.slice(3)}`}
function snkPos(i){if(i<7)return[1,i+1];if(i===7)return[2,7];if(i<15)return[3,7-(i-8)];if(i===15)return[4,1];if(i<23)return[5,1+(i-16)];if(i===23)return[6,7];return[7,7-(i-24)]}
let SN={tab:0,q:null,g:0,res:[],shown:false,run:0};
function snake(){const Z=CUR.SNAKE;const tabs=['Змейка «ال» · стр. '+Z.page,'☀️ или 🌙?'];let body='';
 if(SN.tab===0)body=`<div class="hrow">${LAB(Z.n,'اِسْتَمِعْ وَرَدِّدْ')}<button class="btn" id="snAll">${I.play}Слушать всё по порядку</button><button class="btn ghost" id="snStop">Стоп</button><span class="lead">Нажмите на слово. Дети повторяют хором.</span></div>
  <div class="ar" style="text-align:center;font:700 34px var(--fa);color:var(--u)">${Z.title}</div>
  <div class="sunkey"><span style="border-color:#f2b72b">☀️ солнечная: <b class="ar" style="font-size:20px">ل</b> не читается, буква после неё с шаддой</span><span style="border-color:#3b3f8f">🌙 лунная: <b class="ar" style="font-size:20px">لْ</b> читается</span></div>
  <div class="snk">${Z.w.map(([l,w],i)=>{const [r,c]=snkPos(i);return `<button class="tl ${isSun(w)?'sun':'moon'}" style="--r:${r};--c:${c}" data-p="${Z.pre}_${i}"><span class="lt">${l}</span><span>${snkHtml(w)}</span></button>`}).join('')}</div>`;
 else{if(!SN.q){SN.q=shuffle(Z.w.map((_,i)=>i)).slice(0,10);SN.g=0;SN.res=[];SN.shown=false}
  const i=SN.g;
  if(i>=SN.q.length){const ok=SN.res.filter(Boolean).length;body=`<div class="stage"><div class="done"><div class="big5">${ok} / ${SN.q.length}</div><button class="btn main" id="snAgain">Ещё раз</button></div></div>`}
  else{const k=SN.q[i],w=Z.w[k][1],sun=isSun(w);
   body=`<div class="hrow">${LAB('','اِسْتَمِعْ: شَمْسِيَّةٌ أَمْ قَمَرِيَّةٌ؟',['ear'])}<span class="lead">Звучит слово со змейки. «ال» в нём солнечная или лунная? Ответ проверяется по букве, ключ точный.</span></div><div class="stage"><div class="row" style="justify-content:center;gap:10px">${SN.q.map((v,j)=>`<span style="width:18px;height:18px;border-radius:50%;background:${j<i?(SN.res[j]?'var(--ok)':'var(--no)'):'#efdfe7'}"></span>`).join('')}</div>
   <button class="speaker pulse" id="snSpk" aria-label="Повторить">${I.spk}</button>
   ${SN.shown?`<div class="syl snk1">${snkHtml(w)}</div><div class="lead">${SN.res[i]?'Верно!':(sun?'Это солнечная: ل не читается.':'Это лунная: لْ читается.')}</div><button class="btn main" id="snNext">${I.left}Дальше</button>`
   :`<div class="sunq"><button class="s" data-sun="1"><b>☀️</b>солнечная</button><button class="m" data-sun="0"><b>🌙</b>лунная</button></div>`}</div>`}}
 $('#view').innerHTML=`<div class="row"><div class="seg">${tabs.map((t,i)=>`<button data-st="${i}" class="${i===SN.tab?'on':''}">${t}</button>`).join('')}</div></div>`+body;
 $$('[data-st]').forEach(b=>b.onclick=()=>{SN={tab:+b.dataset.st,q:null,g:0,res:[],shown:false,run:0};snake();if(SN.tab===1)setTimeout(()=>SN.q&&play(Z.pre+'_'+SN.q[0]),300)});
 $$('.snk [data-p]').forEach(b=>b.onclick=()=>{SN.run=0;play(b.dataset.p,b)});
 if($('#snAll')){$('#snAll').onclick=()=>{const run=SN.run=Date.now();const els=[...$$('.snk [data-p]')];let i=0;const nx=()=>{if(SN.run!==run||i>=els.length||S.view!=='sounds')return;const el=els[i++];el.scrollIntoView({block:'nearest'});const a=play(el.dataset.p,el);if(a)a.onended=()=>{el.classList.remove('playing');setTimeout(nx,Math.max(1500,(a.duration||1)*1600))}};nx()};$('#snStop').onclick=()=>{SN.run=0;if(cur)cur.pause()}}
 if($('#snSpk'))$('#snSpk').onclick=()=>play(Z.pre+'_'+SN.q[SN.g]);
 $$('[data-sun]').forEach(b=>b.onclick=()=>{const k=SN.q[SN.g];const ok=(b.dataset.sun==='1')===isSun(Z.w[k][1]);tone(ok);SN.res.push(ok);SN.shown=true;snake();play(Z.pre+'_'+k)});
 if($('#snNext'))$('#snNext').onclick=()=>{SN.g++;SN.shown=false;snake();if(SN.g<SN.q.length)setTimeout(()=>play(Z.pre+'_'+SN.q[SN.g]),400)};
 if($('#snAgain'))$('#snAgain').onclick=()=>{SN.q=null;snake();setTimeout(()=>play(Z.pre+'_'+SN.q[0]),300)};
}
// нашид из نَشَاط (урок ٧ стр. ٧٢): страница книги и запись издателя
function nashid(){const N=CUR.nashid;
 $('#view').innerHTML=`<div class="hrow">${LAB('',N.title,['ear','rep'])}<button class="btn main" id="nP">${I.play}Слушать</button><button class="btn ghost" id="nS">Стоп</button><button class="btn ghost" id="nB">${I.right}Игра со словами</button></div>
 <div style="display:flex;justify-content:center"><img class="zoom nashidimg" src="${A[N.img]}" alt="Страница книги: нашид"></div>`;
 $('#nP').onclick=()=>play(N.audio);$('#nS').onclick=()=>{if(cur)cur.pause()};$('#nB').onclick=()=>{AC.nashid=0;activity()}}

// ================= pairs =================
let P={ex:0,card:0,hide:false,sq:-1,cue:0,hint:false};
function pairNow(){const n=Math.max(1,S.kids.length);return{KA:S.kids[S.chain%n],KB:S.kids[(S.chain+1)%n],ia:S.chain%n,ib:(S.chain+1)%n}}
function pairs(){
 const ex=PAIRS[P.ex];const {KA,KB,ia,ib}=pairNow();const g=KB.g==='f'?1:0;let body,chips='';
 if(ex.items[0].surprise){
  if(P.sq<0)body=`<div class="pic" style="display:grid;place-items:center;aspect-ratio:1;background:var(--uLL);border-radius:20px"><div style="font-size:100px">🎁</div></div><div class="bubs"><button class="btn main" id="sq" style="font-size:18px">Вытянуть вопрос</button><span class="lead" style="direction:ltr">Вопрос выпадет вместе с картинкой: по ней ребёнок и отвечает.</span></div>`;
  else{const q=ex.items[P.sq];const [ci,ca]=q.cues[P.cue%q.cues.length];
   body=`<div class="pic"><img class="zoom" src="${PIC(ci)}" alt="" style="border:4px solid var(--gold);border-radius:18px"></div><div class="bubs"><span style="font:900 14px var(--fr);color:var(--u)">вопрос ${q.n}</span><div class="bubble q">${q.q[g]}</div>${P.hint?`<div class="bubble r">${g?femAns(ca):ca}</div>`:`<button class="btn ghost" id="hint" style="align-self:flex-end">Показать ответ</button>`}</div>`}
 }else if(ex.fill){
  const it=ex.items[P.card%ex.items.length];const done=P.fa===it.a;
  body=`<div class="pic"><img class="zoom" src="${PIC(it.img)}" alt=""></div><div class="bubs"><div class="bubble ${done?'r':'q'}" style="font-size:34px">${done?it.full:it.s.replace('___','<span style="color:var(--u)">_____</span>')}</div>${done?'':`<div class="chs">${it.ch.map((c,j)=>`<button data-fc="${j}" class="${P.fa===j?'bad':''}">${c}</button>`).join('')}</div>`}</div>`;
  chips=`<div class="chips">${ex.items.map((x,j)=>`<button class="chip ${j===P.card%ex.items.length?'on':''}" data-chip="${j}">${AN[j]}</button>`).join('')}</div>`;
 }else{
  const it=ex.items[P.card%ex.items.length];const hid=P.hide?' hid':'';
  const ans=it.a.length>1?it.a[g]:(g?femAns(it.a[0]):it.a[0]);
  body=`<div class="pic"><img class="zoom" src="${PIC(it.img)}" alt=""></div><div class="bubs"><div class="bubble q${hid}">${it.q[g]}</div><div class="bubble r${hid}">${ans}</div>${it.r?`<div class="bubble q${hid}">${it.r[g]}</div>`:''}${it.r2?`<div class="bubble r${hid}">${it.r2}</div>`:''}</div>`;
  if(ex.items.length>1)chips=`<div class="chips">${ex.items.map((x,j)=>`<button class="chip ${j===P.card%ex.items.length?'on':''}" data-chip="${j}"><img src="${PIC(x.img)}" alt="">${x.lab||SUBW[x.img]||''}</button>`).join('')}</div>`;
 }
 const lt=ex.lab||(ex.items[0].surprise?'تَبَادَلِ الْحِوَارَ مَعَ زَمِيلِكَ':'تَبَادَلِ السُّؤَالَ وَالْجَوَابَ مَعَ زَمِيلِكَ');
 $('#view').innerHTML=`<div class="hrow">${LAB(AN[P.ex],lt)}<div class="seg">${PAIRS.map((p,i)=>`<button data-ex="${i}" class="${i===P.ex?'on':''}">Упр. ${AN[i]}</button>`).join('')}</div></div>
 <div class="who2"><span class="nm a">спрашивает: ${KA.n}</span>${I.left.replace('<svg','<svg style="width:24px;height:24px"')}<span class="nm b">отвечает: ${KB.n}</span></div>
 <div style="display:flex;justify-content:flex-end"><div class="frame pairs">${body}<span class="rep">${IC('rep')}</span>${chips}</div></div>
 <div class="row" style="margin-top:14px"><button class="btn go" id="ok">Пара справилась ★</button><button class="btn ghost" id="skip">Следующая пара</button>${ex.items[0].surprise||ex.fill?'':`<button class="btn ghost" id="hide">${P.hide?'Показать текст':'Размыть текст'}</button>`}</div>`;
 $$('[data-ex]').forEach(b=>b.onclick=()=>{P.ex=+b.dataset.ex;P.card=0;P.sq=-1;P.hint=false;P.fa=null;pairs()});

// LINES:{page,W,H,rows:[цвета рядов],people:[[ключ,имя,картинка,x]…],nodes:{ключ:[слово,x,y,ряд]},paths:[{p,c,via:[узлы],pts:[[x,y]…],s}]}
// Ребёнок (или учитель по подсказке детей) нажимает слова по линии по порядку; в конце — предложение-образец.
let LNS={sel:null,step:0,done:{},show:false,bad:null};
function lnCurve(pts){let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)},${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)},${p2[0]} ${p2[1]}`}return d}
function lines8(){const Z=CUR.LINES,P=Z.paths;const sp=LNS.sel?P.find(p=>p.p===LNS.sel):null;

 const nOn=sp?sp.via.slice(0,LNS.show?sp.via.length:LNS.step):[];
 const fin=sp&&(LNS.show||LNS.step===sp.via.length);

 svg+=P.map(p=>`<path class="pth" d="${lnCurve(p.pts)}"/>`).join('');
 svg+=P.filter(p=>LNS.done[p.p]&&p!==sp).map(p=>`<path class="pth hi" style="stroke:${p.c};opacity:.35" d="${lnCurve(p.pts)}"/>`).join('');
 const hp=sp&&upTo(sp,nOn.length);if(sp)svg+=hp?`<path class="pth hi" style="stroke:${sp.c}" d="${lnCurve(hp)}"/>`:'';
 svg+=Object.entries(Z.nodes).map(([k,[t,x,y,r]])=>{const on=nOn.includes(k);return `<g class="nd r${r} ${on?'on':''} ${LNS.bad===k?'bad':''}" data-nd="${k}"><circle cx="${x}" cy="${y}" r="80" style="stroke:${on?sp.c:Z.rows[r]}"/><text x="${x}" y="${y+4}">${t}</text></g>`}).join('');
 svg+=Z.people.map(([k,nm,img,x])=>`<g class="pp ${LNS.sel===k?'sel':''} ${LNS.done[k]?'done':''}" data-pp="${k}"><rect class="fr" x="${x-104}" y="14" width="208" height="262" rx="24"/><image href="${A[img]}" x="${x-96}" y="22" width="192" height="182" preserveAspectRatio="xMidYMid slice"/><text x="${x}" y="240">${nm}</text>${LNS.done[k]?`<text x="${x+80}" y="38" style="font-size:40px">✓</text>`:''}</g>`).join('');
 svg+='</svg>';
 $('#view').innerHTML=`<div class="hrow">${LAB('','اِعْمَلْ جُمَلًا حَسَبَ الْخَطِّ',['talk'])}<button class="btn ghost" id="lnShow">Показать путь</button><button class="btn ghost" id="lnRe">Заново</button>${CUR.ACT?`<button class="btn ghost" id="lnA">${I.left}Фразы урока</button>`:''}<span style="font-weight:900;color:var(--mut)">${Object.keys(LNS.done).length} из ${P.length}</span></div>

 <div class="lnsay">${sp?`<div class="bubble ${fin?'r':'q'}">${said}</div>`:`<div class="bubble q" style="font:800 20px var(--fr);direction:ltr">Выберите человека наверху</div>`}</div>

 // 6) вопросы по тексту для чтения — только в части, где текст уже пройден

 const q=TS.q[TS.i];let body='',prompt='';
 const QA=qA(q),QW=k=>qW(q,k);
 if(q.type==='listen'){prompt='Послушай и выбери картинку';body=`<button class="speaker pulse" id="tSpk" aria-label="Послушать">${I.spk}</button><div class="opts n4">${q.opts.map(k=>`<button class="op" data-a="${k===q.t?1:0}"><img src="${QA['w_'+k]}" alt=""></button>`).join('')}</div>`}
 if(q.type==='readpic'){prompt='Прочитай и выбери картинку';body=`<div class="ask">${QW(q.t).w}</div><div class="opts n4">${q.opts.map(k=>`<button class="op" data-a="${k===q.t?1:0}"><img src="${QA['w_'+k]}" alt=""></button>`).join('')}</div>`}
 if(q.type==='tf'){prompt='Подходит слово к картинке?';body=`<div class="row" style="gap:24px;justify-content:center"><div class="op tfcard"><img src="${QA['w_'+q.img]}" alt=""></div><div class="ask">${QW(q.word).w}</div></div><div class="tf"><button data-a="${q.ok?1:0}" aria-label="Да">👍</button><button data-a="${q.ok?0:1}" aria-label="Нет">👎</button></div>`}
 if(q.type==='gap'){prompt='Вставь пропущенное слово';body=`<div class="ask">${q.s.replace('___','<span style="color:var(--u)">_____</span>')}</div><div class="chs">${q.ch.map(([c,j])=>`<button data-a="${j===q.a?1:0}">${c}</button>`).join('')}</div>`}
 if(q.type==='lword'){prompt='Послушай и выбери слово';body=`<button class="speaker pulse" id="tSpk" aria-label="Послушать">${I.spk}</button><div class="chs">${q.opts.map(k=>`<button data-a="${k===q.t?1:0}">${QW(k).w}</button>`).join('')}</div>`}
 if(q.type==='sun'){prompt='Послушай: «ال» солнечная или лунная?';body=`<button class="speaker pulse" id="tSpk" aria-label="Послушать">${I.spk}</button><div class="sunq"><button class="s" data-a="${isSun(q.w)?1:0}"><b>☀️</b>солнечная</button><button class="m" data-a="${isSun(q.w)?0:1}"><b>🌙</b>лунная</button></div>`}
 if(q.type==='who'){prompt='Послушай: кто это сказал?';body=`<button class="speaker pulse" id="tSpk" aria-label="Послушать">${I.spk}</button><div class="chs">${q.sp.map((s,j)=>`<button data-a="${s===q.a?1:0}" style="color:${j?'var(--blue)':'#2e7d32'}">${s}</button>`).join('')}</div>`}
 if(q.src)prompt='🔁 Вспомним урок '+q.src+' · '+prompt;
 if(q.retry)prompt='Второй шанс · '+prompt;
 const MC=['#ef6c00','#3cae4a','#2f80d1','#d6337a'];
 if(q.type==='match'&&q.qa){prompt='Прочитай и соедини вопрос с ответом';const usedP=Object.values(q.done);
  body=`<div class="mt qa" id="mt"><div class="mcol">${q.w.map((k,i)=>`<button class="mw ${q.done[i]!=null?'ok':''} ${q.sel===i?'sel':''}" data-mw="${i}">${q.qa[k][0]}</button>`).join('')}</div><div class="mcol">${q.p.map((k,j)=>`<button class="mw ${usedP.includes(j)?'ok':''}" data-mp="${j}">${q.qa[k][1]}</button>`).join('')}</div><svg class="mlines"></svg></div>`}
 else if(q.type==='match'){prompt='Соедини слово с картинкой';const usedP=Object.values(q.done);
  body=`<div class="mt" id="mt"><div class="mcol">${q.w.map((k,i)=>`<button class="mw ${q.done[i]!=null?'ok':''} ${q.sel===i?'sel':''}" data-mw="${i}">${W(k).w}</button>`).join('')}</div><div class="mcol">${q.p.map((k,j)=>`<button class="mp ${usedP.includes(j)?'ok':''}" data-mp="${j}" aria-label="Картинка ${j+1}"><img src="${A['w_'+k]}" alt=""></button>`).join('')}</div><svg class="mlines"></svg></div>`}
 if(q.type==='build'){prompt='Собери фразу: нажимай слова по порядку';const full=q.got.length===q.ws.length;
  body=`<div class="bline ${full?'done':''}">${q.got.map(i=>`<span>${q.ws[i]}</span>`).join('')}${full?'':'<span class="ph">…</span>'}</div><div class="chs">${q.order.map(i=>`<button data-bw="${i}" ${q.got.includes(i)?'disabled':''}>${q.ws[i]}</button>`).join('')}</div>`}
 if(q.type==='readq'){prompt='Прочитай текст и ответь';body=`<div class="sheet text" style="max-width:820px"><div class="holes"><i></i><i></i><i></i></div>${RTEXT.map(r=>r[1]).join(' ')}</div><div class="ask" style="font-size:32px">${q.q}</div><div class="chs">${q.ch.map((c,j)=>`<button data-a="${j===q.a?1:0}">${c}</button>`).join('')}</div>`}
 $('#view').innerHTML=`<div class="row" style="direction:ltr"><b style="font-size:20px">Тест · урок ${LN}${TS.name?' · '+TS.name:''}</b>${pips}<span style="font-weight:900;color:var(--mut)">${TS.i<R?(TS.i+1)+' / '+R:'Второй шанс'}</span></div><div class="stage"><div class="tq"><div class="prompt">${prompt}</div>${body}${stampBar()}</div></div>`;
 if($('#tSpk')){const s=()=>playQ(q,q.type==='who'?'d_'+q.li:q.type==='sun'?CUR.SNAKE.pre+'_'+q.i:'a_'+q.t);$('#tSpk').onclick=s;setTimeout(s,350)}
 const nxt=()=>{TS.lock=false;TS.i++;test()};
 const fin=ok=>{if(TS.res.length>TS.i)return;TS.res.push(ok);if(!ok)retryQ(q);const t0=TS;if(!UI.stamp)setTimeout(()=>{if(TS!==t0||S.view!=='test')return;nxt()},1700)};
 if(q.type==='match'){
  const box=$('#mt');const draw=()=>{if(!box.isConnected)return;const r0=box.getBoundingClientRect();box.querySelector('svg').innerHTML=Object.entries(q.done).map(([i,j])=>{const a=box.querySelector(`[data-mw="${i}"]`).getBoundingClientRect(),b=box.querySelector(`[data-mp="${j}"]`).getBoundingClientRect();return `<line x1="${a.left-r0.left}" y1="${a.top+a.height/2-r0.top}" x2="${b.right-r0.left}" y2="${b.top+b.height/2-r0.top}" stroke="${MC[i]}" stroke-width="6" stroke-linecap="round"/>`}).join('')};
  requestAnimationFrame(draw);
  $$('[data-mw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.mw;if(q.done[i]!=null)return;q.sel=i;if(!q.qa)play('a_'+q.w[i]);test()});
  $$('[data-mp]').forEach(b=>b.onclick=()=>{const j=+b.dataset.mp;if(q.sel==null||Object.values(q.done).includes(j))return;
   if(q.w[q.sel]===q.p[j]){q.done[q.sel]=j;q.sel=null;tone(true);test();if(Object.keys(q.done).length===4)fin(q.err<=1)}
   else{q.err++;tone(false);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}});
  wireStamp(()=>{q.w.forEach((k,i)=>{q.done[i]=q.p.indexOf(k)});q.sel=null;test()},()=>{if(TS.res.length<=TS.i)TS.res.push(null);nxt()});return}
 if(q.type==='build'){
  $$('[data-bw]').forEach(b=>b.onclick=()=>{const i=+b.dataset.bw;if(q.got.length>=q.ws.length)return;
   if(q.ws[i]===q.ws[q.got.length]){q.got.push(i);tone(true);test();if(q.got.length===q.ws.length){play('d_'+q.li);fin(q.err<=1)}}
   else{q.err++;tone(false);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}});
  wireStamp(()=>{q.got=q.ws.map((_,i)=>i);test()},()=>{if(TS.res.length<=TS.i)TS.res.push(null);nxt()});return}
 $$('[data-a]').forEach(b=>b.onclick=()=>{if(TS.lock)return;TS.lock=true;const ok=b.dataset.a==='1';tone(ok);b.classList.add(ok?'good':'bad');if(!ok){const g=document.querySelector('[data-a="1"]');setTimeout(()=>g&&g.classList.add('good'),300)}TS.res.push(ok);afterAns(q,ok);const t0=TS;if(!UI.stamp)setTimeout(()=>{if(TS!==t0||S.view!=='test')return;nxt()},q.type==='who'?2200:1800)});
 wireStamp(()=>{const g=document.querySelector('[data-a="1"]');g&&g.classList.add('good')},()=>{if(TS.res.length<=TS.i)TS.res.push(null);nxt()});
}
function hwLink(){const base=location.href.split('#')[0].split('?')[0];
 const parts=[...(CUR.HW||[]).map((h,i)=>[`Часть ${i+1} · ${h.t}`,'-'+(i+1)]),['Весь урок','']];
 $('#hwModal .box').innerHTML=`<b style="font-size:20px">Домашка · урок ${LN}</b><span style="color:var(--mut)">Отправьте детям ссылку на ту часть, которую уже прошли. Откроется только тест, без остальных разделов. Вопросы каждый раз перемешаны. В конце ребёнок пишет имя и присылает скриншот.</span>
 ${parts.map(([t,s],i)=>`<div class="hwrow"><b>${t}</b><div class="hwl"><input readonly value="${base.replace(/[^/]*$/,'')}hw/l${LN}${s}.html?v=${typeof HW_V!='undefined'?HW_V:1}" id="hwU${i}" aria-label="Ссылка"><button class="btn main" data-cp="${i}">Копировать</button></div></div>`).join('')}
 <div class="row" style="direction:ltr"><button class="btn ghost" id="hwClose">Закрыть</button></div>`;
 $('#hwClose').onclick=()=>$('#hwModal').classList.remove('on');
 $$('[data-cp]').forEach(b=>b.onclick=async()=>{const inp=$('#hwU'+b.dataset.cp);try{await navigator.clipboard.writeText(inp.value);b.textContent='Скопировано ✓'}catch(e){inp.focus();inp.select();b.textContent='Выделено, скопируйте'}});
 $('#hwModal').classList.add('on')}
$('#hwClose').onclick=()=>$('#hwModal').classList.remove('on');
$('#hwCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#hwUrl').value);$('#hwCopy').textContent='Скопировано ✓'}catch(e){$('#hwUrl').select();$('#hwCopy').textContent='Выделено, нажмите Ctrl+C'}};

function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#b84773','#f5b800','#3cae4a','#e9672e','#2c66b8'];const Pp=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:4+Math.random()*6,c:cols[Math.random()*5|0],a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);Pp.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++n<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

useLesson(HW?+HWM[1]:5);if(HW&&HWM[2]&&CUR.HW&&CUR.HW[+HWM[2]-1])TPART=+HWM[2];if(HW){document.body.classList.add('hw');S.view='test'}
render();
</script>
