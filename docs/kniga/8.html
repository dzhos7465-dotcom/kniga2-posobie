<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Живая книга · урок 8 · الْأَيَّامُ</title>
<meta name="theme-color" content="#14361d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Lalezar';src:url(fonts/lalezar-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Lalezar';src:url(fonts/lalezar-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Noto Naskh Arabic';font-weight:700;src:url(fonts/noto-naskh-arabic-arabic-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;src:url(fonts/nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:'Nunito';font-weight:900;src:url(fonts/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-04FF}
:root{
 --g:#2f9a45;--g2:#22803a;--gd:#1d4a28;--gdd:#0c2414;--gl:#e7f4e3;
 --gold:#ffc21a;--gold2:#f2a100;--goldl:#fff4cf;
 --paper:#fffaf0;--paper2:#f8f0de;--ink:#1d2a1f;--mute:#7d8a7a;--line:#ece2cc;
 --ok:#2bb673;--okl:#dcf7e8;--bad:#e5484d;--badl:#fde4e4;
 --spk1:#2f9a45;--spk2:#2f6fd1;
 --fa:'Noto Naskh Arabic','Amiri',serif;--fh:'Lalezar','Noto Naskh Arabic',serif;--fr:'Nunito',system-ui,sans-serif;
 --r1:12px;--r2:18px;--r3:28px;
 --sh:0 1px 1px rgba(40,30,10,.06),0 4px 10px rgba(40,30,10,.07),0 14px 30px rgba(40,30,10,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--fr);font-weight:800;color:var(--ink);background:radial-gradient(120% 90% at 30% 0%,#24592f 0%,var(--gd) 38%,var(--gdd) 100%);overflow:hidden}
.bt,.chip,.sc,.big,.hint,.teach,.tg{direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.ar{font-family:var(--fa);font-weight:700;direction:rtl;unicode-bidi:isolate}
img{display:block;max-width:100%}

/* ---------- каркас ---------- */
#app{display:grid;grid-template-columns:92px 1fr;grid-template-rows:1fr auto;height:100vh;height:100dvh;padding:18px 22px 16px 0;gap:14px 0}
#rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2px;overflow:auto}
.badge{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font:34px var(--fh);color:#2a1d00;
 background:linear-gradient(180deg,#ffd75a,var(--gold) 45%,var(--gold2));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #c98400,0 10px 22px rgba(0,0,0,.35);text-decoration:none;margin-bottom:6px}
.pgb{position:relative;width:58px;height:46px;border-radius:14px;font:20px var(--fa);font-weight:700;color:#cfe6cf;
 background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25);transition:.2s}
.pgb:hover{color:#fff}
.pgb.on{background:linear-gradient(180deg,#fff,#f1ead7);color:var(--g2);box-shadow:inset 0 2px 0 #fff,0 3px 0 #cdbf9c,0 8px 18px rgba(0,0,0,.35)}
.pgb.done::after{content:'';position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.25),0 0 8px var(--gold)}
#top{display:none}
#stage{position:relative;min-height:0;display:flex}
#book{flex:1;display:flex;flex-direction:row-reverse;min-height:0;border-radius:var(--r3);
 box-shadow:0 2px 0 rgba(255,255,255,.08) inset,0 20px 50px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.3);position:relative}
.pg{flex:1;min-width:0;position:relative;background:linear-gradient(180deg,var(--paper),#fdf6e6);overflow:auto;padding:26px 30px 46px;direction:rtl;scrollbar-width:thin;scrollbar-color:#e2d6b8 transparent}
.pg.r{border-radius:0 var(--r3) var(--r3) 0;background:linear-gradient(270deg,var(--paper) 88%,#efe4cb)}
.pg.l{border-radius:var(--r3) 0 0 var(--r3);background:linear-gradient(90deg,var(--paper) 88%,#efe4cb)}
.pg.full{border-radius:var(--r3);background:linear-gradient(180deg,var(--paper),#fbf2df)}
.spine{width:2px;background:linear-gradient(180deg,#e2d4b4,#cdbb92,#e2d4b4);box-shadow:0 0 14px 4px rgba(120,90,30,.18)}
.pno{position:sticky;top:100%;height:0;font:20px var(--fa);font-weight:700;color:#b4a986}
.pg.r .pno{text-align:left}.pg.l .pno{text-align:right}
.pno span{position:relative;top:14px}

/* ---------- задание ---------- */
.ex{position:relative;margin-bottom:30px;border-radius:var(--r2);padding:4px;transition:box-shadow .25s}
.ex.act{box-shadow:0 0 0 2px rgba(47,154,69,.0)}
.exh{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.exn{min-width:44px;height:40px;padding:0 10px;border-radius:13px;display:grid;place-items:center;font:24px var(--fh);color:#fff;
 background:linear-gradient(180deg,#46b25b,var(--g) 50%,var(--g2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #17642a,0 6px 14px rgba(34,128,58,.3)}
.exh h2{margin:0;font:30px/1.25 var(--fh);font-weight:400;color:var(--g2);letter-spacing:0}
.exh .sub{font:20px var(--fh);color:#b07a00}
.exh .tag{font:16px var(--fh);background:var(--g);color:#fff;border-radius:999px;padding:4px 14px}
.exh .sc{margin-inline-start:auto;font:14px var(--fr);font-weight:900;color:var(--g2);background:var(--gl);border-radius:999px;padding:5px 12px;direction:ltr}
.hint{direction:ltr;text-align:right;font-size:14px;color:var(--mute);margin:-6px 0 12px}
.acts{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{font-size:14px;font-weight:900;padding:8px 14px;border-radius:12px;color:var(--g2);background:linear-gradient(180deg,#fff,#f3eee0);
 box-shadow:inset 0 1px 0 #fff,0 2px 0 #ddd2b5,0 4px 10px rgba(60,40,0,.07)}
.chip.on{color:#fff;background:linear-gradient(180deg,#46b25b,var(--g2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 #17642a}

/* ---------- кнопки звука и перевода ---------- */
.pl{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background:radial-gradient(circle at 35% 30%,#5cc56f,var(--g) 55%,var(--g2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #17642a,0 6px 12px rgba(34,128,58,.3);transition:.2s}
.pl svg{width:15px;height:15px;margin-left:2px}
.pl.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #17642a,0 0 0 6px rgba(255,194,26,.35),0 0 22px 6px rgba(255,194,26,.55)}
.rub{flex:none;height:30px;min-width:38px;border-radius:999px;font-size:13px;font-weight:900;color:var(--g2);background:linear-gradient(180deg,#fff,#f1ecdf);
 box-shadow:inset 0 1px 0 #fff,0 2px 0 #dcd1b3,0 3px 8px rgba(60,40,0,.08)}
.rub.on{background:linear-gradient(180deg,#26402b,#16281a);color:#fff;box-shadow:0 2px 0 #0a150c}
.ru{display:none;direction:ltr;text-align:right;font-size:14px;color:#5d6b5a;margin-top:4px;font-weight:800}
.ru.show,body.ruon .ru{display:block}

/* ---------- диалог ---------- */
.scene{border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);margin-bottom:18px;background:#fff;position:relative}
.scene img{width:100%;max-height:240px;object-fit:cover}
.ln{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.ln .who{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:19px var(--fa);font-weight:700;color:#fff;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 8px rgba(0,0,0,.15)}
.ln.s1 .who{background:linear-gradient(180deg,#4fb862,var(--spk1))}
.ln.s2 .who{background:linear-gradient(180deg,#5b93e6,var(--spk2))}
.bub{min-width:0;padding:9px 18px 10px;border-radius:18px;transition:.25s;position:relative}
.bub .ar{font-size:25px;line-height:1.55;display:block}
.ln.s1 .bub{background:linear-gradient(180deg,#eef8ea,#e1f2db);color:#1c6a2e;box-shadow:inset 0 1px 0 #fff,0 2px 0 #cfe5c7}
.ln.s2 .bub{background:linear-gradient(180deg,#edf3fd,#dfe9fb);color:#1f4f9e;box-shadow:inset 0 1px 0 #fff,0 2px 0 #c9d8f2}
.ln.on .bub,.glow{box-shadow:0 0 0 3px var(--gold),0 0 0 7px rgba(255,194,26,.28),0 0 26px 6px rgba(255,194,26,.45)!important}
.blur .bub .ar{filter:blur(7px);opacity:.7}

/* ---------- карточки слов ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wc{position:relative;border-radius:var(--r2);background:linear-gradient(180deg,#fff,#fbf7ee);box-shadow:var(--sh);padding:10px 8px 10px;text-align:center;transition:transform .2s,box-shadow .2s}
.wc img{width:100%;aspect-ratio:1/1.02;object-fit:contain;border-radius:14px}
.wc .ar{display:block;font-size:24px;margin-top:4px;color:var(--ink)}
.wc.on{transform:translateY(-4px);background:linear-gradient(180deg,#fff8dd,#ffe9a8)}
.hidew .wc .ar{visibility:hidden}
.wc .rub{position:absolute;top:8px;left:8px;height:26px;min-width:32px;font-size:12px}
.wc .ru{text-align:center}

/* ---------- состояния ответа ---------- */
.ok{background:linear-gradient(180deg,#eafbf1,var(--okl))!important;box-shadow:0 0 0 2px #9fe3bf,0 0 18px 2px rgba(43,182,115,.35),0 4px 10px rgba(0,0,0,.06)!important}
.bad{background:linear-gradient(180deg,#fff1f1,var(--badl))!important;box-shadow:0 0 0 2px #f6b3b5,0 0 16px 2px rgba(229,72,77,.25)!important;animation:shk .35s}
.ok::before,.bad::before{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:900 14px var(--fr);color:#fff;z-index:3;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.2)}
.ok::before{content:'✓';background:linear-gradient(180deg,#3fcf86,#1f9c5f)}
.bad::before{content:'✕';background:linear-gradient(180deg,#f2686c,#cf2f35)}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- дерево ---------- */
.treew{position:relative;border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);background:#fff}
.treew img{width:100%}
.hs{position:absolute;border-radius:14px;transition:.25s}
.hs:hover{background:rgba(255,255,255,.18)}
.hs.spot{box-shadow:0 0 0 4px var(--gold),0 0 0 2000px rgba(10,30,15,.28),0 0 24px 8px rgba(255,194,26,.6)}
.hs.ok,.hs.bad{background:transparent!important}
.hs.ok{box-shadow:0 0 0 4px var(--ok),0 0 24px 6px rgba(43,182,115,.6)!important}
.hs.bad{box-shadow:0 0 0 4px var(--bad)!important}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:12px 16px;border-radius:var(--r2);background:linear-gradient(180deg,#fff,#f7f1e2);box-shadow:var(--sh)}
.prompt .ar{font-size:26px;flex:1}
.tfb{width:64px;height:52px;border-radius:14px;font:900 26px var(--fr);position:relative}
.tfb.y{color:var(--g2);background:linear-gradient(180deg,#fff,#eef7ea);box-shadow:inset 0 1px 0 #fff,0 3px 0 #cfe3c6}
.tfb.n{color:#b23a3e;background:linear-gradient(180deg,#fff,#fbeeee);box-shadow:inset 0 1px 0 #fff,0 3px 0 #ecd0d0}
.after{width:100%;font-size:22px;color:var(--g2)}

/* ---------- صِلْ кольцами ---------- */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
.ring{position:relative;aspect-ratio:160/170}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .pc{position:absolute;top:0;width:42%;aspect-ratio:1;border-radius:14px;background:#fff;box-shadow:var(--sh);padding:4px}
.ring .pc img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.ring .pc.a{right:2%}.ring .pc.b{left:2%}
.ring .lt{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--c),0 2px 6px rgba(0,0,0,.15);font:15px var(--fa);font-weight:700;line-height:24px;color:var(--c)}
.ring .wd{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--c),0 6px 14px rgba(0,0,0,.12);font:21px var(--fa);font-weight:700;color:var(--ink);transition:.25s}
.ring .wd.on{box-shadow:0 0 0 4px var(--c),0 0 0 9px rgba(255,194,26,.35),0 0 24px 6px rgba(255,194,26,.5)}
.ring.solved .wd{background:var(--c);color:#fff}
.ring path{fill:none;stroke:#e7decb;stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.ring.solved path.win{stroke:var(--c)}

/* ---------- слушание с номерами ---------- */
.abrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.num{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:20px var(--fa);font-weight:700;color:#3d2a00;
 background:linear-gradient(180deg,#ffd75a,var(--gold) 50%,var(--gold2));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #c98400}
.pick{position:relative;width:118px;border-radius:var(--r2);background:linear-gradient(180deg,#fff,#fbf7ee);box-shadow:var(--sh);padding:6px;transition:.2s}
.pick img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px}
.pick .lt{position:absolute;top:6px;right:9px;font:17px var(--fa);font-weight:700;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pgrid .pick{width:auto}
.slot{margin:6px auto 0;width:46px;height:40px;border-radius:12px;border:2px dashed #d8cba8;display:grid;place-items:center;font:22px var(--fa);font-weight:700;color:var(--g2)}
.slot.f{border:0;background:linear-gradient(180deg,#fff,#f2efe4);box-shadow:inset 0 0 0 2px var(--g)}
.nums{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.nb{width:46px;height:44px;border-radius:13px;font:21px var(--fa);font-weight:700;color:var(--g2);background:linear-gradient(180deg,#fff,#f3eee0);box-shadow:inset 0 1px 0 #fff,0 3px 0 #ddd2b5,0 5px 10px rgba(60,40,0,.08);transition:.2s}
.nb.on{color:#3d2a00;background:linear-gradient(180deg,#ffd75a,var(--gold) 50%,var(--gold2));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 #c98400,0 0 18px 4px rgba(255,194,26,.5)}
.nb.used{opacity:.4}
.blob{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;padding:18px;border-radius:40px;background:linear-gradient(180deg,#f6f0ff,#efe6fb)}
.wchip{position:relative;padding:8px 14px 6px;border-radius:22px 22px 22px 6px;background:#fff;box-shadow:0 0 0 3px var(--c),0 4px 10px rgba(0,0,0,.08);text-align:center;min-width:96px}
.wchip .ar{font-size:22px}
.wchip .slot{width:38px;height:32px;font-size:18px;margin-top:4px}
.clock{position:relative;width:min(100%,520px);aspect-ratio:1;margin:6px auto 0}
.clock .dial{position:absolute;inset:12%;border-radius:50%;border:16px solid #29a8d8;box-shadow:inset 0 0 0 4px #fff}
.clock .hand{position:absolute;left:50%;top:50%;width:6%;height:6%;margin:-3%;border-radius:50%;background:#29a8d8;box-shadow:0 0 0 10px #fff,0 0 0 18px #29a8d8}
.clock .pick{position:absolute;width:24%;transform:translate(-50%,-50%)}
.clock .pick .slot{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);margin:0;background:#fff}
.teach{direction:ltr;text-align:right;font-size:13px;color:#8a6a00;background:var(--goldl);border-radius:10px;padding:6px 10px;margin-top:8px}

/* ---------- пары ---------- */
.model{padding:16px;border-radius:var(--r2);background:linear-gradient(180deg,#fff,#f8f3e6);box-shadow:var(--sh);margin-bottom:14px}
.model .ln .who{width:30px;height:30px;font-size:15px}
.model .ln.s2 .who{background:linear-gradient(180deg,#f4a24c,#e27b18)}
.model .ln.s2 .bub{background:linear-gradient(180deg,#fff4e6,#ffe6c8);color:#9a4c00;box-shadow:inset 0 1px 0 #fff,0 2px 0 #f0d2a8}
.frame{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:var(--r2);border:2px solid #cfe6c8;background:#f6fbf3}
.fc{width:96px;border-radius:14px;background:#fff;box-shadow:var(--sh);padding:5px 5px 6px;text-align:center;transition:.2s;position:relative}
.fc img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px}
.fc .ar{font-size:17px;display:block}
.fc.on{transform:translateY(-3px);background:linear-gradient(180deg,#fff8dd,#ffe9a8);box-shadow:0 0 0 3px var(--gold),0 0 20px 4px rgba(255,194,26,.45)}
.gen{display:flex;gap:6px;margin-inline-start:auto}
.pic76{border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);margin-bottom:22px}
.pic76 img{width:100%;max-height:260px;object-fit:cover}
.surp{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cue{width:150px;border-radius:var(--r2);background:#fff;box-shadow:var(--sh);padding:8px;text-align:center;position:relative}
.cue img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px}
.cue .ar{font-size:18px;display:block;min-height:30px}
.cue .ar.hid{filter:blur(6px);opacity:.6}
.big{padding:14px 22px;border-radius:16px;font-size:17px;font-weight:900;color:#3d2a00;background:linear-gradient(180deg,#ffd75a,var(--gold) 50%,var(--gold2));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #c98400,0 10px 20px rgba(200,130,0,.3)}

/* ---------- змейка ---------- */
.snake{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:16px;border-radius:30px;background:linear-gradient(180deg,#f4ecdc,#eadfc6);box-shadow:inset 0 2px 8px rgba(120,90,30,.15)}
.tile{position:relative;border-radius:16px;padding:6px 2px 8px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 rgba(0,0,0,.12),0 6px 12px rgba(0,0,0,.08);transition:.2s}
.tile.sun{background:linear-gradient(180deg,#fff6c8,#ffe27a)}
.tile.moon{background:linear-gradient(180deg,#eaf2ff,#c9dcfb)}
.tile .l{font:24px var(--fa);font-weight:700;display:block;line-height:1.3}
.tile .ar{font-size:15px;display:block}
.tile .ic{position:absolute;top:2px;left:5px;font-size:11px}
.tile.on{box-shadow:0 0 0 3px var(--gold),0 0 20px 5px rgba(255,194,26,.55)}

/* ---------- чтение ---------- */
.r1s{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rc{position:relative;text-align:center;padding:12px;border-radius:var(--r2);background:#fff;box-shadow:var(--sh)}
.rc .ci{width:120px;height:120px;margin:0 auto 8px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 5px var(--c),0 6px 14px rgba(0,0,0,.12);background:#fff}
.rc .ci img{width:100%;height:100%;object-fit:contain}
.rc .lt{position:absolute;top:10px;right:14px;font:20px var(--fa);font-weight:700;color:var(--mute)}
.rc .ar{font-size:21px;display:block}
.qa{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 70px}
.qa svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.qcol,.acol{display:flex;flex-direction:column;gap:10px}
.qb{position:relative;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;text-align:right;transition:.2s}
.qcol .qb{background:linear-gradient(180deg,#fff3e6,#ffe4c6);box-shadow:inset 0 1px 0 #fff,0 2px 0 #f0cfa2}
.acol .qb{background:linear-gradient(180deg,#f0f8e6,#e0efcf);box-shadow:inset 0 1px 0 #fff,0 2px 0 #c9e0b0}
.qb .ar{font-size:19px;flex:1}
.qb .lt{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font:15px var(--fa);font-weight:700;color:var(--mute)}
.qb.on{box-shadow:0 0 0 3px var(--gold),0 0 18px 4px rgba(255,194,26,.5)}
.qb.ok::before,.qb.bad::before{display:none}
.rtext{display:flex;gap:16px;align-items:flex-start}

 dialog:`<h4>Как работать с диалогом (5 мин)</h4><div class="n">1. «Только слушать»: текст размыт. Перед этим одна фраза по-русски: «Когда услышите ${AR8('يَوْمَ')}, хлопните».</div><div class="n">2. «Весь диалог». Говорят двое: ${AR8('فَضْل')} (зелёный) спрашивает, ${AR8('مُحَمَّد')} (синий) отвечает днями недели.</div><div class="n">3. Второй раз с текстом, по одной строке, пауза 3 секунды.</div><div class="n">4. Третий раз хором: дети повторяют ответы ${AR8('مُحَمَّد')}.</div><h4>Опора на старое</h4><div class="n">${AR8('مَتَى')} знают с урока 6 (${AR8('مَتَى تُعْطِينِي…؟')}). ${AR8('عَمّ، جَدّ، خَال')} — урок 5. Новое в диалоге — только дни и ${AR8('تَزُورُ، خَالَة، لَيْلَة، وَسَط، الْأُسْبُوع')}.</div><h4>Жесты</h4><div class="n">${AR8('تَزُورُ')} — «постучать в дверь». ${AR8('لَيْلَةَ')} — ладонь у щеки (сон). ${AR8('وَسَطَ')} — ладони в стороны, палец в середину.</div><div class="n">${AR8('لَيْلَةَ الثُّلَاثَاءِ')} — это вечер накануне вторника (вечер понедельника): у арабов ночь идёт перед своим днём. Скажите это детям по-русски один раз.</div>`,
 words:`<h4>Слова (5–7 мин)</h4><div class="n">Нажмите на карточку, звучит диктор. Сначала 7 дней по порядку, потом 5 слов. Потом «Скрыть слова»: вы показываете картинку, дети называют хором.</div><div class="n">Дни — это порядок. Дети уже знают порядковые (урок 2): ${AR8('الْأَوَّلُ، الثَّانِي…')}. Неделя в книге начинается с ${AR8('السَّبْتُ')}.</div><h4>Ввести заранее</h4><div class="n">${AR8('أَزُورُهُ / أَزُورُهَا')} — блоком: ${AR8('ـهُ')} «его» (мужчину), ${AR8('ـهَا')} «её» (женщину). Покажите на ${AR8('خَال')} и ${AR8('خَالَة')}.</div><div class="n">${AR8('خَالَة')} — сестра мамы, ${AR8('عَمَّة')} — сестра папы (на дереве стр. 74 есть обе стрелки).</div><h4>Счётчик (цель 40 за занятие)</h4><div class="n">${AR8('السَّبْت ☐ الْأَحَد ☐ الْإِثْنَيْن ☐ الثُّلَاثَاء ☐ الْأَرْبِعَاء ☐ الْخَمِيس ☐ الْجُمُعَة ☐')}</div><div class="n">${AR8('يَزُورُ ☐ خَالَة ☐ لَيْلَة ☐ وَسَط ☐ الْأُسْبُوع ☐')}</div>`,
 tree:`<h4>Дерево семьи · стр. 74 (5 мин)</h4><div class="n">В книге это задание «смотри»: стрелки показывают, кто кому кто. Кнопка «Стрелки · как в книге» открывает страницу книги. Главная новая стрелка — ${AR8('خَالَة')}: от ${AR8('نُهَى')} к ${AR8('سُهَى')}.</div><div class="n">«Где мой…?» и «Правда или нет?» — только знакомые слова: ${AR8('خَالَتِي، خَالِي، عَمِّي، جَدِّي، جَدَّتِي')}. Говорите фразу два раза. <span class="p">3 сек</span> Дети показывают.</div><div class="n">Ловушка: для ${AR8('عِيسَى')} тётя ${AR8('هَالَة')} — ${AR8('عَمَّة')}, а не ${AR8('خَالَة')} (она сестра папы).</div><h4>Соедини · стр. 74</h4><div class="n">Как в книге: слово в кружке, сверху две картинки ${AR8('أ')} и ${AR8('ب')}. Ребёнок нажимает на слово (звучит диктор), потом на свою картинку. Верная половина круга окрашивается. В Zoom дети называют букву.</div>`,
 listen:`<h4>Слушание · стр. 75 и 79</h4><div class="n">Звук издателя без музыки: диктор называет номер и слово.</div><div class="n">Упр. ٣, ٤, ٥ стр. 75: ключи надёжные, каждое слово я сравнил с эталонным словом диктора. В упр. ٤ шесть картинок — шесть номеров.</div><div class="n">Упр. ٢ стр. 79 (часы): звучат фразы другого диктора, ключ я не определил. Номера ставятся, но ответ проверяете вы на слух.</div>`,
 sounds:`<h4>«ال» солнечная и лунная · стр. 78</h4><div class="n">Змейка — все 28 букв по алфавиту. Жёлтые плитки ☀️ — солнечные: ${AR8('ل')} не читается, следующая буква удваивается (${AR8('الشَّمْسُ')} = аш-шамсу). Синие 🌙 — лунные: ${AR8('لْ')} читается (${AR8('الْقَمَرُ')} = аль-камару).</div><div class="n">Нажмите на плитку, дети повторяют хором. «Слушать всё по порядку» — с паузой для повтора.</div><div class="n">Правило без слов: дети смотрят на цвет. Серая ${AR8('ل')} — молчит, синяя ${AR8('لْ')} — звучит.</div><div class="n">«☀️ или 🌙?» — 10 слов со змейки на слух. Ключ точный (по букве).</div><div class="n">Слова змейки — тренировка звука, значения не разбираем. Знакомые: ${AR8('الْجَدُّ، الْقَلَمُ، الْيَوْمُ، الْوَاحِدُ')}.</div>`,
 pairs:`<h4>Пары по цепочке</h4><div class="n">Не раньше третьего занятия по теме. Сначала модель: вы читаете обе роли два раза.</div><div class="n">Девочке вопрос задаётся с ${AR8('تَزُورِينَ … ـكِ')} (${AR8('مَتَى تَزُورِينَ جَدَّكِ؟')}) — приложение подставляет форму само по полу отвечающего. В книге этой формы нет: если не хотите вводить, читайте вопрос мальчиковой формы.</div><div class="n">Упр. ١: ответ «${AR8('لَيْلَةَ … وَيَوْمَ …')}» — два дня. Упр. ٢: ${AR8('أَزُورُهُ')} (мужчину), последняя карточка ${AR8('خَالَة')} — ${AR8('أَزُورُهَا')}. Упр. ٣: четыре реплики, все ${AR8('أَزُورُهَا')}.</div><div class="n">Упр. ٤ — «Вопрос-сюрприз»: вопрос выпадает с картинкой дня, по ней ребёнок отвечает.</div><div class="n">${AR8('عَمَّة')} (упр. ٣) — только узнавание, картинка — ${AR8('هَالَة')} с дерева.</div>`,

 letters:`<h4>Буквы ط ظ ف ق · стр. 81</h4><div class="n">В диалоге этих букв почти нет, поэтому «Охота за буквой» идёт по фразам урока: ${AR8('ط')} в ${AR8('وَسَطَ، طَوِيلَةٌ، الطَّعَامُ')}, ${AR8('ظ')} в ${AR8('الظُّهْرُ')}, ${AR8('ف')} в ${AR8('فِي، الْفَصْلُ')}, ${AR8('ق')} в ${AR8('صَدِيقَكَ، الْقَلَمُ')}.</div><div class="n">${AR8('ط / ت')} и ${AR8('ظ / ذ')} — толстые и тонкие, как ${AR8('ص / س')} в уроке 7.</div>`,

// ---------- окна: закрепить, учителю ----------
function openOv(html){$('#win').innerHTML='<button class="x" title="Закрыть">✕</button>'+html;$('#ov').classList.add('show');$('#win .x').onclick=closeOv}
function closeOv(){$('#ov').classList.remove('show');stopAll()}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeOv()};
$('#zak').onclick=()=>{let pool=wordsIn($('#book'));if(pool.length<4)pool=D.words.map(w=>w.k);let streak=0;
 openOv('<h3>🎯 Закрепить · слушай и найди</h3><div class="gtop"></div><div class="game"></div>');
 const round=()=>{const opts=shuffle(pool).slice(0,4),t=opts[Math.random()*4|0];const top=$('.gtop'),g=$('.game');top.innerHTML='';g.innerHTML='';
  const p=plBtn('a_'+t);top.append(p,h(`<span style="font-size:15px;color:var(--mute)">Подряд верно: <b style="color:var(--g2);font-size:20px">${streak}</b></span>`));
  opts.forEach(k=>{const c=h(`<div class="wc"><img src="${A('w_'+k)}" alt=""><span class="ar">${W[k].w}</span></div>`);
   c.onclick=()=>{if(k===t){c.classList.add('ok');streak++;stopAll();play('a_'+k,null).then(()=>setTimeout(round,400))}else{c.classList.add('bad');streak=0;setTimeout(()=>c.classList.remove('bad'),700)}};g.append(c)});
  setTimeout(()=>p.click(),300)};round()};
const NOTEKEY=[['dialog','words'],['tree','listen'],['pairs'],['sounds','listen'],['read','letters'],['activity']];
$('#tch').onclick=()=>{const ks=NOTEKEY[spreadOf(cur)]||[];
 openOv('<h3>📖 Учителю · страницы '+viewPages().map(p=>p.replace(/[٠-٩]/g,d=>DIG.indexOf(d))).join('–')+'</h3>'+ks.map(k=>D.NOTES[k]||'').join('')+
 `<h4>Домашка (ссылки для детей)</h4>${D.HW.map((p,i)=>`<div class="hwl"><a href="../hw/l${N}-${i+1}.html" target="_blank">Часть ${i+1}<small>${p.t}</small></a><button class="chip" data-u="hw/l${N}-${i+1}.html">Копировать</button></div>`).join('')}`);
 $$('#win [data-u]').forEach(b=>b.onclick=()=>{const u=new URL('../'+b.dataset.u,location.href).href;navigator.clipboard?.writeText(u);b.textContent='Скопировано ✓'})};
// ---------- вход учителя: долгое нажатие на номер урока ----------
function longPress(el){let t=null,fired=false;
 el.addEventListener('pointerdown',()=>{fired=false;t=setTimeout(()=>{fired=true;teacher?tchMenu():pinWin()},700)});
 ['pointerup','pointerleave','pointercancel'].forEach(e=>el.addEventListener(e,()=>clearTimeout(t)));
 el.addEventListener('click',e=>{if(fired){e.preventDefault();e.stopPropagation()}});
 el.addEventListener('contextmenu',e=>e.preventDefault())}
function pinWin(){openOv('<h3>Учительская версия</h3><div class="pin"><input type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="Код учителя"><div class="err"></div><button class="big">Войти</button></div>');
 const box=$('#win .pin'),inp=$('input',box),go1=async()=>{if(await sha('kniga2:'+inp.value)===TEACH_H){try{localStorage.setItem('knT',TEACH_H)}catch(e){}teacher=true;setMode();closeOv();render()}
  else{box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');$('.err',box).textContent='Неверный код';inp.value=''}};
 $('button',box).onclick=go1;inp.onkeydown=e=>{if(e.key==='Enter')go1()};setTimeout(()=>inp.focus(),50)}
function tchMenu(){openOv('<h3>Учительская версия включена</h3><p class="n">На этом устройстве открыты все страницы и панель учителя.</p><button class="big" id="kidv">Выйти: детский вид</button>');
 $('#kidv').onclick=()=>{try{localStorage.removeItem('knT')}catch(e){}teacher=false;setMode();closeOv();render()}}
(async()=>{try{teacher=localStorage.getItem('knT')===TEACH_H}catch(e){}setMode();render()})();
</script>
