<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Книга 2 · пособие по урокам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Оформление по страницам учебника: шапка урока с волной и пальмой, кружки частей ١–٥,
   плашки заданий со значками, всё выровнено вправо как страница книги; дети со звёздами сбоку */
:root{
  --u:#b84773; --uD:#8c2d55; --uL:#fbe7ef; --uLL:#fff5f9;
  --sand:#f6c85a; --green:#3cae4a; --orange:#e9672e; --purple:#7d3c98; --maroon:#7a2b3a; --blue:#2c66b8;
  --ink:#2b2230; --mut:#7c6f80; --line:#f0dfe7; --paper:#fff; --bg:#fdf8fa; --sheet:#fffdf7; --rule:#ecdfc9;
  --ok:#3cae4a; --no:#e0404f; --gold:#f5b800;
  --fa:'Noto Naskh Arabic',serif; --fq:'Amiri Quran','Noto Naskh Arabic',serif; --ft:'Lalezar','Noto Naskh Arabic',serif; --fr:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fr);color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--fa);direction:rtl;line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;height:100%}
.app.side{grid-template-columns:200px 1fr}
.app.side .band,.app.side .subtabs,.app.side .view{grid-column:2}
.app.side .foot{grid-column:1;grid-row:1/5;flex-direction:column;align-items:stretch;border-top:0;border-right:2px dashed var(--line);padding:12px 10px;overflow:auto}
.app.side .foot .kid{justify-content:space-between;font-size:15px;padding:7px 12px}
.app.side .foot .kid button{opacity:1}
.app.side .foot .pg{margin:auto 0 0;flex-direction:column;text-align:center;font-size:11px}
.app.side.fold{grid-template-columns:46px 1fr}
.app.side.fold .foot>*:not(.fhead){display:none}
.app.side.fold .fhead span{display:none}
.fhead{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--u);font-size:14px}
.fhead button{background:var(--uLL);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900;color:var(--uD)}
.app:not(.side) .fhead{display:none}

/* ---------- book band ---------- */
.band{position:relative;color:#fff;padding:10px 22px 32px;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 90px,rgba(255,255,255,0) 90px 180px),linear-gradient(180deg,var(--u),var(--uD) 160%)}
.band::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:30px;background:var(--bg);
  -webkit-mask:radial-gradient(60px 26px at 60px 0,transparent 98%,#000) -60px 0/120px 30px repeat-x;mask:radial-gradient(60px 26px at 60px 0,transparent 98%,#000) -60px 0/120px 30px repeat-x}
.band .in{display:flex;align-items:center;gap:16px;direction:rtl;flex-wrap:wrap}
.island{position:relative;width:112px;height:80px;flex:none}
.island .sand{position:absolute;bottom:0;left:4px;right:0;height:22px;border-radius:50%;background:var(--sand);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.island .n{position:absolute;right:6px;bottom:6px;font:80px/1 var(--ft);color:#fff;-webkit-text-stroke:5px var(--u);paint-order:stroke fill}
.island svg{position:absolute;left:4px;bottom:12px;width:62px;height:78px}
.band h1{font:42px/1.25 var(--ft);text-shadow:0 3px 0 rgba(0,0,0,.12)}
.band .rus{font:800 14px var(--fr);opacity:.85;direction:ltr}
.parts{display:flex;gap:8px;margin-inline-start:auto;direction:rtl;align-items:center;flex-wrap:wrap}
.pc{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--u);font:700 24px/1 var(--fa);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.pc.on{background:var(--uD);color:#fff;box-shadow:inset 0 0 0 3px #fff,0 0 0 4px var(--sand)}
.pc.wide{width:auto;padding:0 14px;border-radius:22px;font:700 19px/1 var(--fa)} .pc.rus{font:900 13px/1 var(--fr)}
.tools{display:flex;gap:6px;direction:ltr;flex-wrap:wrap}
.tb{background:rgba(255,255,255,.18);color:#fff;padding:7px 11px;border-radius:12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.tb:hover{background:rgba(255,255,255,.3)} .tb.on{background:#fff;color:var(--u)} .tb svg{width:16px;height:16px}
.subtabs{display:flex;gap:8px;padding:0 24px;flex-wrap:wrap;align-items:center;margin-top:-8px;position:relative;z-index:2;direction:rtl}
.st{padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:15px;color:#5d5162;direction:ltr}
.st.on{border-color:var(--u);color:var(--u);background:var(--uLL)} .st small{font-weight:800;color:var(--mut);margin-left:6px}

/* ---------- page & footer ---------- */
.view{overflow:auto;padding:14px 26px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.foot{display:flex;gap:8px;align-items:center;padding:8px 18px 10px;border-top:2px dashed var(--line);background:#fff;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;background:var(--uLL);border:2px solid var(--line);font-weight:800;font-size:14px}
.kid.f{border-color:#f3b5cd} .kid.m{border-color:#b6cff0}
.kid.ask{background:#e6f6e8;border-color:var(--green)} .kid.ans{background:#fff0e3;border-color:var(--orange)}
.kid .s{color:var(--gold)} .kid .tst{font-size:11px;color:var(--mut);font-weight:900}
.kid button{opacity:0;font-size:12px;font-weight:900;color:var(--u)} .kid:hover button{opacity:1}
.pg{margin-left:auto;display:flex;align-items:center;gap:8px;direction:rtl;font:700 13px var(--fa);color:var(--u)}
.pg b{border:2px solid var(--u);border-radius:14px;padding:0 12px;font:700 18px var(--fa)}

/* ---------- right-aligned rows ---------- */
.hrow,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;direction:rtl}
.hrow>*,.row>*{direction:ltr}
.lab{display:inline-flex;align-items:center;direction:rtl!important}
.lab .no{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 22px var(--fa)}
.lab .tx{background:var(--u);color:#fff;font:700 21px/1.4 var(--fa);padding:5px 22px 7px 16px;margin-right:-10px}
.lab .ics{display:flex;gap:4px;background:var(--u);padding:4px 10px 4px 6px;border-radius:22px 0 0 22px;margin-right:-1px}
.lab.nonum .tx{border-radius:0 22px 22px 0;margin-right:0;padding-right:18px}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;flex:none}
.ic svg{width:20px;height:20px}
.ic.eye{background:#fff;color:var(--u);border-color:var(--u)} .ic.ear{background:var(--orange);color:#fff} .ic.rep{background:var(--green);color:#fff}
.ic.talk{background:var(--maroon);color:#fff} .ic.read{background:var(--purple);color:#fff} .ic.write{background:#8b4a2e;color:#fff} .ic.link{background:var(--sand);color:#7a4b00}
.paper{background:var(--paper);border-radius:22px;border:3px solid var(--line)}
.frame{background:#fff;border:3px solid var(--u);border-radius:26px;position:relative}
.frame>.rep{position:absolute;left:-14px;bottom:-14px}
.lead{color:var(--mut);font-size:15px;max-width:66ch;line-height:1.45}
.btn{display:inline-flex;gap:8px;align-items:center;white-space:nowrap;padding:9px 16px;border-radius:999px;font-weight:800;font-size:15px;background:var(--uL);color:var(--uD);border:2px solid transparent}
.btn.main{background:var(--u);color:#fff} .btn.go{background:var(--green);color:#fff} .btn.ghost{background:#fff;border-color:var(--line);color:#5d5162}
.btn svg{width:17px;height:17px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;direction:ltr}
.seg button{padding:6px 13px;border-radius:999px;font-weight:800;font-size:14px;color:#6b6070}
.seg button.on{background:var(--u);color:#fff}
.sheet{background:var(--sheet);border:2px solid #efe1c8;border-radius:8px 20px 20px 8px;box-shadow:4px 4px 0 #f3e7d1;background-image:repeating-linear-gradient(transparent 0 calc(var(--lh,58px) - 2px),var(--rule) calc(var(--lh,58px) - 2px) var(--lh,58px))}
.zoom{cursor:zoom-in}

/* ---------- home ---------- */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.lt{text-align:right;border-radius:24px;overflow:hidden;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column}
.lt .top{background:var(--c);height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;direction:rtl}
.lt .top .n{font:64px/1 var(--ft);color:#fff;-webkit-text-stroke:4px rgba(0,0,0,.18);paint-order:stroke fill}
.lt .top svg{width:46px;height:58px}
.lt .t{font:30px/1.3 var(--ft);color:var(--c);padding:10px 16px 0;direction:rtl}
.lt .s{font-size:13px;font-weight:800;color:var(--mut);padding:2px 16px 14px;text-align:left}
.lt .s.ready{color:var(--green)} .lt[disabled]{opacity:.55;cursor:default}

/* ---------- dialogue ---------- */
.dlg{display:grid;grid-template-columns:minmax(0,56%) minmax(0,1fr);gap:24px;align-items:start;direction:rtl}
.dlg .pic{border-radius:24px;overflow:hidden;border:3px solid var(--line);background:#fff;position:relative}
.dlg .pic img{width:100%;display:block}
.hintz{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font:800 12px var(--fr);color:var(--mut);direction:ltr}
.lines{padding:10px 8px}
.ln{display:flex;gap:12px;align-items:center;padding:4px 12px;border-radius:14px;direction:rtl;text-align:right;width:100%}
.ln:hover{background:var(--uLL)}
.ln .who{font:700 21px var(--fa);color:var(--maroon);min-width:70px}
.ln .tx{font:500 clamp(21px,2.1vw,29px)/1.75 var(--fa);flex:1}
.ln.a .tx{color:#1f8a4c} .ln.b .tx{color:var(--blue)}
.ln .pl{width:32px;height:32px;border-radius:50%;background:var(--uL);display:grid;place-items:center;color:var(--u);flex:none}
.ln .pl svg{width:15px;height:15px}
.ln.cur{background:#fff3c4}
.lines.blur .tx{filter:blur(9px);opacity:.6}

/* ---------- words ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;direction:rtl}
.wc{display:flex;flex-direction:column;align-items:center;transition:.15s;border-radius:20px;padding:6px}
.wc:hover{transform:translateY(-3px);background:var(--uLL)}
.wc img{width:100%;aspect-ratio:1;object-fit:contain}
.wc .w{font:700 29px/1.5 var(--fa)} .wc.blue .w{color:var(--blue)}
.wc.hideword .w{color:transparent;background:var(--uL);border-radius:10px;min-width:70%}
.wc.playing{box-shadow:0 0 0 4px var(--gold)}
.big{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;direction:rtl}
.big .card{padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.big img{width:min(46vh,420px);aspect-ratio:1;object-fit:contain}
.big .w{font:700 62px/1.4 var(--fa)}
.arrow{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--line);display:grid;place-items:center;color:var(--u)}
.arrow svg{width:26px;height:26px}

/* ---------- options / games ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;direction:rtl}
.gt{text-align:left;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-radius:22px;background:#fff;border:3px solid var(--line);position:relative;direction:ltr}
.gt:hover{border-color:var(--u)} .gt b{font:900 19px var(--fr)} .gt span{color:var(--mut);font-size:14px;line-height:1.4}
.gt em{font-style:normal;font-size:12px;font-weight:900;color:var(--u);text-transform:uppercase;letter-spacing:.04em}
.gt .ic{position:absolute;top:12px;right:12px}
.ghead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:4px} .pips i{width:13px;height:13px;border-radius:50%;background:#efdfe7} .pips i.ok{background:var(--ok)} .pips i.no{background:var(--no)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;min-height:320px;position:relative}
.stage::before{content:'';margin-top:auto;margin-bottom:-18px}.stage::after{content:'';margin-bottom:auto;margin-top:-18px} /* по центру, а если не помещается — сверху, без наезда на заголовок */
.gstage{background:#fff;border:2px dashed var(--line);border-radius:26px;padding:22px 150px;position:relative}
.deco{position:absolute;bottom:12px;width:120px;pointer-events:none}
.deco.l{left:14px} .deco.r{right:14px}
.opts{display:grid;gap:18px;width:100%;max-width:1000px;direction:rtl}
.opts.n2{grid-template-columns:repeat(2,minmax(0,300px));justify-content:center}
.opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.op{padding:10px;position:relative;transition:.2s;background:#fff;border:3px solid var(--line);border-radius:22px}
.op img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.op .tag{position:absolute;top:-14px;right:-10px;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--u);color:var(--u);display:grid;place-items:center;font:700 23px var(--fa)}
.op .bx,.blob .bx{position:absolute;bottom:-14px;left:-10px;width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--c,var(--u));display:grid;place-items:center;font:700 25px var(--fa);color:var(--u)}
.op .bx.ok,.blob .bx.ok{border-color:var(--ok);background:#ecf8ee;color:#2c8a3a} .op .bx.no,.blob .bx.no{border-color:var(--no);background:#fde6e8;color:var(--no)}
.op.good{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)} .op.bad{border-color:var(--no);animation:shake .35s} .op.dim{opacity:.35}
.op.sel{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.speaker{width:88px;height:88px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 0 0 4px var(--orange);flex:none}
.speaker svg{width:40px;height:40px} .speaker.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.tf{display:flex;gap:20px}
.tf button{width:116px;height:116px;border-radius:30px;font-size:56px;background:#fff;border:3px solid var(--line)}
.tf button.good{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)} .tf button.bad{border-color:var(--no);animation:shake .35s}
.tfcard{padding:12px} .tfcard img{width:min(36vh,300px);aspect-ratio:1;object-fit:contain;display:block}
.memo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:100%;max-width:1000px;direction:rtl}
.cover{aspect-ratio:1;border-radius:18px;background:repeating-linear-gradient(45deg,var(--u),var(--u) 12px,var(--uD) 12px,var(--uD) 24px)}
.gone{aspect-ratio:1;border-radius:18px;border:4px dashed var(--u);display:grid;place-items:center;font:60px var(--ft);color:var(--u)}
.count{font:90px var(--ft);color:var(--u)}
.slot{min-height:86px;width:100%;max-width:820px;display:flex;flex-wrap:wrap;gap:10px;padding:14px;direction:rtl;align-items:center;justify-content:center;--lh:46px;transform:rotate(-.5deg)}
.slot.ok{box-shadow:4px 4px 0 #cfe9d3;border-color:var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:rtl}
.tile{font:700 32px/1.5 var(--fa);padding:4px 20px;border-radius:16px;background:#fff;border:3px dashed #d9c3cf}
.tile:hover{border-color:var(--u)} .tile.used{visibility:hidden} .tile.bad{animation:shake .35s;border-color:var(--no)}
.tile.good{border-style:solid;border-color:var(--ok);background:#ecf8ee} .tile.sel{border-style:solid;border-color:var(--gold);background:#fff7d6} .tile.playing{border-style:solid;border-color:var(--gold)}
.done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.big5{font:84px var(--ft);color:var(--u)}
.conc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;width:100%;max-width:1100px;direction:rtl}
.cc{aspect-ratio:1.1;border-radius:18px;font:700 clamp(16px,1.7vw,24px)/1.4 var(--fa);display:grid;place-items:center;padding:6px;text-align:center;transition:.25s}
.cc.back{background:repeating-linear-gradient(45deg,var(--u),var(--u) 10px,var(--uD) 10px,var(--uD) 20px);color:#fff;font:34px var(--ft)}
.cc.face{background:#fff;border:3px solid var(--u)} .cc.got{background:#ecf8ee;border:3px solid var(--ok);opacity:.85}
.stampbar{display:flex;gap:10px;justify-content:center}

/* ---------- tree (spotlight) ---------- */
.tw{position:relative;width:min(100%,calc((100vh - 360px) * 1.229));aspect-ratio:1610/1310;align-self:center}
.tw>img{width:100%;height:100%;border-radius:22px;display:block}
.tw .dim{position:absolute;inset:0;border-radius:22px;background:rgba(25,12,22,.48);pointer-events:none}
.hot{position:absolute;border-radius:12px;transition:.2s}
.hot:hover{background:rgba(255,255,255,.16)}
.lift{position:absolute;overflow:hidden;border-radius:14px;transform:scale(1.15);z-index:3;box-shadow:0 0 0 4px #fff,0 0 0 9px var(--gold),0 10px 28px rgba(0,0,0,.45);pointer-events:none}
.lift.bad{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--no)} .lift.ok{box-shadow:0 0 0 4px #fff,0 0 0 9px var(--ok),0 0 34px 10px rgba(60,174,74,.6)}
.lift img{position:absolute;max-width:none}
.ttag{position:absolute;z-index:4;background:var(--gold);color:var(--ink);font:700 22px/1.4 var(--fa);padding:0 14px;border-radius:999px;border:3px solid #fff;transform:translate(-50%,-125%);pointer-events:none}
.say{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;direction:rtl}
.bubble{font:700 clamp(24px,2.5vw,34px)/1.6 var(--fa);direction:rtl;background:#fff;padding:4px 24px;border-radius:22px;border:3px solid var(--line)}
.bubble.q{border-color:#6ec27a;background:#effaf1} .bubble.r{border-color:#f0a25c;background:#fff4e8}
.bubble.hid{color:transparent;text-shadow:0 0 16px rgba(0,0,0,.4)}

/* ---------- listening (book style) ---------- */
.field{background:var(--uLL);border-radius:40px;padding:30px 30px 34px;display:flex;flex-wrap:wrap;gap:30px 28px;justify-content:center;direction:rtl;max-width:1050px}
.blob{position:relative;font:700 32px/1.5 var(--fa);padding:14px 30px;background:#fff;border:4px solid var(--c);border-radius:42% 58% 52% 48%/55% 45% 55% 45%;display:flex;align-items:center;gap:8px}
.blob .bx{top:-18px;bottom:auto}
.blob.now{box-shadow:0 0 0 6px var(--gold)} .blob img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.lbar{display:flex;gap:14px;align-items:center;direction:rtl;flex-wrap:wrap}
.lbar .num{font:700 30px var(--fa);color:var(--u)}

/* ---------- pairs ---------- */
.pairs{display:grid;grid-template-columns:minmax(180px,300px) 1fr;gap:26px;align-items:center;padding:18px 22px 40px;width:min(100%,900px);direction:rtl}
.pairs .pic img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:18px}
.who2{display:flex;gap:12px;align-items:center;font-weight:900;font-size:clamp(17px,1.7vw,22px);flex-wrap:wrap;direction:rtl}
.nm{padding:5px 16px;border-radius:999px;direction:ltr} .nm.a{background:#e6f6e8;color:#24803a} .nm.b{background:#fff0e3;color:#b0560e}
.bubs{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bubs .bubble.r{align-self:flex-end}
.chips{position:absolute;left:50%;transform:translateX(-50%);bottom:-26px;background:#fff;border:3px solid var(--u);border-radius:999px;padding:4px 10px;display:flex;gap:8px;white-space:nowrap;direction:rtl}
.chip{display:flex;align-items:center;gap:6px;font:700 20px var(--fa);padding:0 12px 0 4px;border-radius:999px}
.chip img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #eee;background:#fff}
.chip.on{background:var(--uL);outline:3px solid var(--u)}
.cue{display:flex;gap:16px;align-items:center;direction:rtl}

 .dlg,.pairs,.readwrap{grid-template-columns:1fr}.opts.n4{grid-template-columns:repeat(2,1fr)}.memo,.conc{grid-template-columns:repeat(3,1fr)}.letters{grid-template-columns:repeat(2,1fr)}.band h1{font-size:30px}.gstage{padding:16px}.deco{display:none}.towers{grid-template-columns:1fr}}

let X={ex:{1:0,2:3},i:0,ans:{},checked:{},mode:'now',hint:false};

 const list=LX.filter(e=>e.part===part);let ei=X.ex[part];
 const ex=LX[ei];const cnt=ex.type==='ab'?ex.items.length:(ex.key?ex.key.length:ex.count);

 const head=`<div class="hrow">${LAB(ex.n,ex.title)}<div class="seg">${list.map(e=>`<button data-x="${LX.indexOf(e)}" class="${e===ex?'on':''}">Упр. ${e.n}</button>`).join('')}</div>
  ${ex.key||ex.type==='ab'?`<div class="seg"><button id="mNow" class="${X.mode==='now'?'on':''}">Проверять сразу</button><button id="mEnd" class="${X.mode==='end'?'on':''}">Проверить в конце</button></div>`:''}
  ${ex.type==='word'?`<button class="btn ghost" id="xHint">${X.hint?'Убрать подсказку':'Подсказка: картинки'}</button>`:''}
  <button class="btn ghost" id="xReset">Заново</button></div>
 <div class="lbar"><button class="speaker" id="xPlay" aria-label="Слушать">${I.spk}</button><span class="num">الرَّقْمُ ${AN[X.i]}</span><div class="seg">${Array.from({length:cnt},(_,i)=>`<button data-i="${i}" class="${i===X.i?'on':''}">${AN[i]}</button>`).join('')}</div>
  ${X.mode==='end'&&!X.checked[ex.id]&&(ex.key||ex.type==='ab')?`<button class="btn go" id="xCheck">Проверить</button>`:''}</div>`;
 // where each item number is written
 const numsOn=k=>Object.keys(A_).filter(i=>A_[i]===k).map(Number);
 const bx=(k,isAB)=>{const ns=numsOn(k);if(!ns.length)return `<span class="bx"></span>`;const i=ns[ns.length-1];const ok=right(i)===null?'':(right(i)===k?'ok':'no');return `<span class="bx ${chk?ok:''}">${isAB?'✓':AN[i]}</span>`};
 let body='';

  body=`<div class="opts n2">${[['أ',a,'a'],['ب',b,'b']].map(([l,k,s])=>{const st=cA===s?(chk?(s===right(X.i)?'ok':'no'):''):'';return `<button class="op" data-ans="${s}"><span class="tag">${l}</span><img src="${PIC(k)}" alt="">${cA===s?`<span class="bx ${st}">✓</span>`:'<span class="bx"></span>'}</button>`}).join('')}</div>
  <div class="row" style="justify-content:center;gap:6px">${ex.items.map((_,i)=>`<span style="width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:700 15px var(--fa);background:${A_[i]?(chk?(A_[i]===right(i)?'#ecf8ee':'#fde6e8'):'#fff7d6'):'#fff'}">${AN[i]}</span>`).join('')}</div>`}
 if(ex.type==='pic')body=`<div class="opts" style="grid-template-columns:repeat(${ex.pics.length},minmax(0,1fr));max-width:${ex.pics.length*200}px">${ex.pics.map(([l,k])=>`<button class="op" data-ans="${k}"><span class="tag">${l}</span><img src="${PIC(k)}" alt="">${bx(k)}</button>`).join('')}</div>`;
 if(ex.type==='word')body=`<div class="field">${BLOB.map(([k,c])=>`<button class="blob" style="--c:${c}" data-ans="${k}">${X.hint?`<img src="${A['w_'+k]}" alt="">`:''}${W(k).w}${bx(k)}</button>`).join('')}</div>`;
 const fb=(ex.key||ex.type==='ab')?'':`<div class="lead" style="text-align:center">В этом упражнении ответ проверяет учитель на слух.</div>`;
 $('#view').innerHTML=head+`<div class="stage">${body}${fb}</div>`;
 const P=part;
 $$('[data-x]').forEach(b=>b.onclick=()=>{X.ex[P]=+b.dataset.x;X.i=0;listen(P)});
 $$('[data-i]').forEach(b=>b.onclick=()=>{X.i=+b.dataset.i;listen(P);play(ex.id+'_'+X.i)});
 $('#xPlay').onclick=()=>play(ex.id+'_'+X.i);
 if($('#mNow')){$('#mNow').onclick=()=>{X.mode='now';listen(P)};$('#mEnd').onclick=()=>{X.mode='end';listen(P)}}
 if($('#xHint'))$('#xHint').onclick=()=>{X.hint=!X.hint;listen(P)};
 $('#xReset').onclick=()=>{X.ans[ex.id]={};X.checked[ex.id]=false;X.i=0;listen(P)};
 if($('#xCheck'))$('#xCheck').onclick=()=>{X.checked[ex.id]=true;const ok=Object.keys(A_).every(i=>A_[i]===right(i))&&Object.keys(A_).length===cnt;tone(ok);if(ok)confetti();listen(P)};
 $$('[data-ans]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.ans;for(const i in A_)if(A_[i]===k&&ex.type!=='ab')delete A_[i];A_[X.i]=k;
  const r=right(X.i);if(X.mode==='now'&&r!==null)tone(k===r);
  const v0=S.view;const adv=()=>{if(S.view!==v0)return;if(X.i<cnt-1){X.i++;listen(P);setTimeout(()=>play(ex.id+'_'+X.i),300)}else{listen(P);if(X.mode==='now'&&r!==null&&Object.keys(A_).length===cnt&&Object.keys(A_).every(i=>A_[i]===right(i)))confetti()}};
  listen(P);if(!UI.stamp)setTimeout(adv,1100);else{window._adv=adv}});
 if(UI.stamp){$('#view').insertAdjacentHTML('beforeend',stampBar());wireStamp(()=>{const r=right(X.i);if(r===null)return;const el=document.querySelector(`[data-ans="${r}"]`);el&&el.classList.add('good')},()=>{if(X.i<cnt-1){X.i++;listen(P);play(ex.id+'_'+X.i)}})}

let P={ex:0,card:0,hide:false,sq:-1,cue:0,hint:false};
function pairNow(){const n=Math.max(1,S.kids.length);return{KA:S.kids[S.chain%n],KB:S.kids[(S.chain+1)%n],ia:S.chain%n,ib:(S.chain+1)%n}}

   body=`<div class="pic"><img class="zoom" src="${PIC(ci)}" alt="" style="border:4px solid var(--gold);border-radius:18px"></div><div class="bubs"><span style="font:900 14px var(--fr);color:var(--u)">вопрос ${q.n}</span><div class="bubble q">${q.q[g]}</div>${P.hint?`<div class="bubble r">${g?femAns(ca):ca}</div>`:`<button class="btn ghost" id="hint" style="align-self:flex-end">Показать ответ</button>`}</div>`}

 $$('[data-ex]').forEach(b=>b.onclick=()=>{P.ex=+b.dataset.ex;P.card=0;P.sq=-1;P.hint=false;pairs()});

 const P=hwPart();const pool=(P&&P.words)||LD.words.map(w=>w.k);const gp=(P&&P.gaps)?P.gaps.map(i=>GAPS[i]):GAPS;const useRQ=!P||P.rq;
 const ks=shuffle(pool.slice());const qs=[];const opts=t=>shuffle([t,...shuffle(ks.filter(x=>x!==t)).slice(0,3)]);
 for(let i=0;i<5;i++)qs.push({type:'listen',t:ks[i%ks.length],opts:opts(ks[i%ks.length])});
 for(let i=5;i<9;i++)qs.push({type:'readpic',t:ks[i%ks.length],opts:opts(ks[i%ks.length])});
 for(let i=9;i<12;i++){const same=i!==10;qs.push({type:'tf',img:ks[i%ks.length],word:same?ks[i%ks.length]:ks[(i+4)%ks.length],ok:same})}
 const ng=useRQ?4:Math.min(8,gp.length);shuffle(gp).slice(0,ng).forEach(g=>qs.push({type:'gap',...g,ch:shuffle(g.ch.map((c,j)=>[c,j]))}));
 if(useRQ)shuffle(RQ).slice(0,4).forEach(q=>qs.push({type:'readq',...q}));
 else for(let i=0;qs.length<20;i++){const t=ks[(i+3)%ks.length];qs.push({type:i%2?'readpic':'listen',t,opts:opts(t)})}
 return qs}
function test(){
 if(!TS)TS={q:makeTest(),i:-1,res:[],name:'',kid:-1};
 const R=TS.q.length;
 if(TS.i<0){
  $('#view').innerHTML=`<div class="stage"><div class="cert"><div class="ar" style="font:40px var(--ft);color:var(--u)">اِخْتِبَارٌ</div><div style="font-weight:900">Мини‑тест · урок ${CUR.meta.n}${partName()} · ${R} вопросов</div>
  ${hwPart()?`<div class="lead">${hwPart().t}</div>`:''}
  ${!HW&&CUR.HW?`<div class="seg" style="margin:6px auto">${[['Весь урок',0],...CUR.HW.map((h,i)=>['Часть '+toAr(i+1),i+1])].map(([l,v])=>`<button data-part="${v}" class="${TPART===v?'on':''}">${l}</button>`).join('')}</div>`:''}
  ${HW?`<input class="who-in" id="tName" placeholder="Напиши своё имя" aria-label="Имя">`:`<div class="lead">Кто проходит тест? Результат запишется рядом с его звёздами.</div><div class="pick">${S.kids.map((k,i)=>`<button data-kid="${i}">${k.n}</button>`).join('')}<button data-kid="-1">Без имени</button></div>`}
  ${HW?`<button class="btn main" id="tStart">Начать</button>`:''}</div></div>`;
  $$('[data-part]').forEach(b=>b.onclick=()=>{TPART=+b.dataset.part;TS=null;test()});
  $$('[data-kid]').forEach(b=>b.onclick=()=>{TS.kid=+b.dataset.kid;TS.name=TS.kid>=0?S.kids[TS.kid].n:'';TS.i=0;test()});
  if($('#tStart'))$('#tStart').onclick=()=>{TS.name=$('#tName').value.trim();TS.i=0;test()};
  return}
 const pips=`<div class="pips">${TS.q.map((_,j)=>`<i class="${TS.res[j]===true?'ok':TS.res[j]===false?'no':''}"></i>`).join('')}</div>`;
 if(TS.i>=R){
  const ok=TS.res.filter(Boolean).length;const st=ok>=R-1?3:ok>=R*.75?2:ok>=R/2?1:0;const ds=new Date().toLocaleDateString('ru-RU');
  if(TS.kid>=0&&!TS.saved){S.kids[TS.kid].test=ok+'/'+R;S.kids[TS.kid].t+=st;saveKids();TS.saved=1;foot()}
  $('#view').innerHTML=`<div class="stage"><div class="cert"><div class="ar" style="font:44px var(--ft);color:var(--u)">${st===3?'مُمْتَازٌ!':st===2?'جَيِّدٌ جِدًّا!':st===1?'جَيِّدٌ':'حَاوِلْ مَرَّةً أُخْرَى'}</div>
  <div class="big5" style="font-size:72px">${ok} / ${R}</div><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <div style="font-weight:800;color:var(--mut)">Урок ${CUR.meta.n} · ${CUR.meta.t} · ${ds}</div>
  <input class="who-in" id="tName2" placeholder="Напиши своё имя" value="${TS.name}" aria-label="Имя">
  <div class="lead" style="text-align:center">${HW?'Сделай скриншот этого экрана и отправь учителю.':TS.kid>=0?'Результат записан рядом с именем ребёнка.':''}</div>
  <div class="row" style="direction:ltr"><button class="btn main" id="tAgain">Пройти ещё раз</button>${HW?'':`<button class="btn ghost" id="tLink">Ссылка для домашки</button>`}</div></div></div>`;
  $('#tName2').oninput=e=>TS.name=e.target.value;$('#tAgain').onclick=()=>{TS=null;test()};if($('#tLink'))$('#tLink').onclick=hwLink;if(ok>=R*.75)confetti();return}
 const q=TS.q[TS.i];let body='',prompt='';
 if(q.type==='listen'){prompt='Послушай и выбери картинку';body=`<button class="speaker pulse" id="tSpk" aria-label="Послушать">${I.spk}</button><div class="opts n4">${q.opts.map(k=>`<button class="op" data-a="${k===q.t?1:0}"><img src="${A['w_'+k]}" alt=""></button>`).join('')}</div>`}
 if(q.type==='readpic'){prompt='Прочитай и выбери картинку';body=`<div class="ask">${W(q.t).w}</div><div class="opts n4">${q.opts.map(k=>`<button class="op" data-a="${k===q.t?1:0}"><img src="${A['w_'+k]}" alt=""></button>`).join('')}</div>`}
 if(q.type==='tf'){prompt='Подходит слово к картинке?';body=`<div class="row" style="gap:24px;justify-content:center"><div class="op tfcard"><img src="${A['w_'+q.img]}" alt=""></div><div class="ask">${W(q.word).w}</div></div><div class="tf"><button data-a="${q.ok?1:0}" aria-label="Да">👍</button><button data-a="${q.ok?0:1}" aria-label="Нет">👎</button></div>`}
 if(q.type==='gap'){prompt='Вставь пропущенное слово';body=`<div class="ask">${q.s.replace('___','<span style="color:var(--u)">_____</span>')}</div><div class="chs">${q.ch.map(([c,j])=>`<button data-a="${j===q.a?1:0}">${c}</button>`).join('')}</div>`}
 if(q.type==='readq'){prompt='Прочитай текст и ответь';body=`<div class="sheet text" style="max-width:820px"><div class="holes"><i></i><i></i><i></i></div>${RTEXT.map(r=>r[1]).join(' ')}</div><div class="ask" style="font-size:32px">${q.q}</div><div class="chs">${q.ch.map((c,j)=>`<button data-a="${j===q.a?1:0}">${c}</button>`).join('')}</div>`}
 $('#view').innerHTML=`<div class="row" style="direction:ltr"><b style="font-size:20px">Тест · урок ${CUR.meta.n}${TS.name?' · '+TS.name:''}</b>${pips}<span style="font-weight:900;color:var(--mut)">${TS.i+1} / ${R}</span></div><div class="stage"><div class="tq"><div class="prompt">${prompt}</div>${body}${stampBar()}</div></div>`;
 if($('#tSpk')){const s=()=>play('a_'+q.t);$('#tSpk').onclick=s;setTimeout(s,350)}
 const nxt=()=>{TS.lock=false;TS.i++;test()};
 $$('[data-a]').forEach(b=>b.onclick=()=>{if(TS.lock)return;TS.lock=true;const ok=b.dataset.a==='1';tone(ok);b.classList.add(ok?'good':'bad');if(!ok){const g=document.querySelector('[data-a="1"]');setTimeout(()=>g&&g.classList.add('good'),300)}TS.res.push(ok);const t0=TS;if(!UI.stamp)setTimeout(()=>{if(TS!==t0||S.view!=='test')return;nxt()},1300)});
 wireStamp(()=>{const g=document.querySelector('[data-a="1"]');g&&g.classList.add('good')},()=>{if(TS.res.length<=TS.i)TS.res.push(null);nxt()});
}
function hwLink(){$('#hwUrl').value=location.href.split('#')[0]+'#l'+LN+'-test'+(TPART?'-'+TPART:'');$('#hwN').textContent=CUR.meta.n+partName();$('#hwModal').classList.add('on')}
$('#hwClose').onclick=()=>$('#hwModal').classList.remove('on');
$('#hwCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#hwUrl').value);$('#hwCopy').textContent='Скопировано ✓'}catch(e){$('#hwUrl').select();$('#hwCopy').textContent='Выделено, нажмите Ctrl+C'}};

// ================= fx =================
function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#b84773','#f5b800','#3cae4a','#e9672e','#2c66b8'];const Pp=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:4+Math.random()*6,c:cols[Math.random()*5|0],a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);Pp.forEach(p=>{p.y+=p.v;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x+Math.sin(p.a)*8,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++n<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

useLesson(HW?+HWM[1]:5);if(HW&&HWM[2]&&CUR.HW&&CUR.HW[+HWM[2]-1])TPART=+HWM[2];if(HW){document.body.classList.add('hw');S.view='test'}
render();
